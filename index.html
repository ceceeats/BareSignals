/* Home v20 (24 Oct 2026): one content width with the site bar (nav v11): main uses the shared 1240px box with 24px side padding on laptop (16px on phone), so the header line meets the wordmark and the A buttons; progress buttons get ink instead of the browser default black. v19 kept at /home/v19/. Home v19 (23 Oct 2026): Tag text now picks whichever of three inks reads best on each colour: the usual ink on pale tags, a deeper ink (#1F2550) on mid tones like Cellular protection, DNA, Fat, Muscle, Aging and Cancer, cream on dark tags. Fixes dark-on-dark labels. v18 kept at /home/v18/. Home v18 (23 Oct 2026): hooked to nav v10: laptop has five text steps (0.88 to 1.45, default the large A 1.15, saved as bs-text-w), phone keeps three; Home applies the number nav sends (detail.k) to the screens and reads the laptop setting at load. v17 kept at /home/v17/. Home v17 (23 Oct 2026): hooked to nav v9: the text size control (small A / A / large A) moved from the page header to the site bar's wordmark line (the bar stays on screen); Home listens to bs-text and scales the screens as before; the big BARE SIGNALS title is now for screen readers only since the bar already carries the wordmark, the tagline leads; page height reads the bar's reserved space (--bsnav-h0); the gallery highlight in the bar still follows the slide and, when the phone bar is compact, scrolls into view; text size clicks no longer stop the gallery. v16 kept at /home/v16/. Home v16 (23 Oct 2026): gallery highlight in the top bar is orange (tint + ink, orange underline), not blue; top bar links always navigate (capture click handler stops the gallery first); "Open …" button under each screen is solid orange; Library screen is now a moving mini Library (rotating search, sort row on Popular, roles bar folded to colour squares, Option A dose stickers 3 across, slow looping auto-scroll, live data); Dosage cards half size, two per row; Type Rule v1 on every screen (tags, chips and labels at 8.5px mono, one title size) plus the three-step text size control (bs-text). v15 kept at /home/v15/. Home v15 (23 Oct 2026): every gallery screen filled with what that page really shows: Library card adds How it works, synergies, name story; Dosage the top three doses people take and a third compound; Blood Work the markers it moves (aim and warning numbers), while-on tests and red flags; Supplements each pairing's role tag, why and usual dose; Aminos the letters it is built from and their roles; Made what a lab result should list; Calculator a dose table at the same mix and handling steps; Protocol the stack's merged tests and supplements. Same design. v14 kept at /home/v14/. Home v14: one screen, no long scroll. A gallery swipes itself through every page, same size and format each time: Library card, Dosage, Blood Work, Supplements, the Aminos string, Made, Calculator, Protocol. The top bar lights up the page being shown. One compound runs through the whole loop, a new one each loop. Tagline only; ticking compound count. v13 kept at /home/v13/. */
:root{--paper:#FFFFE2;--ink:#3E4A80;--soft:#6B76A8;--accent:#DB6830;--act:#FFE3CF;--rule:#E3E0BF;--chip:#FFFFF4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.mono{font:500 10px/1.4 "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase}
main{max-width:var(--bs-w,1240px);margin:0 auto;padding:12px max(var(--bs-pad,16px),env(safe-area-inset-left,0px)) 10px;display:flex;flex-direction:column;height:calc(100svh - var(--bsnav-h0,126px));min-height:560px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1.5px solid var(--ink)}
.hd h1{font:700 22px/1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 5px;letter-spacing:.04em}
.hd .tag{margin:0;font-size:15px;line-height:1.3;font-style:italic}
.hd .ev{color:var(--accent);white-space:nowrap}
.hd .ev b{font:700 15px "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;display:inline-block}
.hd .ev b.tick{animation:tick .16s ease-out}
.hd .ev i{font-style:normal;display:inline-block;animation:up 1.6s ease-in-out infinite}
@keyframes tick{from{transform:translateY(-35%);opacity:.35}to{transform:none;opacity:1}}
@keyframes up{0%,100%{transform:translateY(1px);opacity:.5}50%{transform:translateY(-2px);opacity:1}}

/* gallery */
.gal{position:relative;flex:1;min-height:0;margin-top:12px;overflow:hidden;touch-action:pan-y}
.sl{position:absolute;top:0;bottom:7px;left:50%;width:min(420px,calc(100vw - 32px));margin-left:calc(min(420px,calc(100vw - 32px)) / -2);transition:transform .55s cubic-bezier(.3,.8,.3,1),opacity .55s;will-change:transform}
.sl .scr{height:100%;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:1000px){.sl{width:560px!important;margin-left:-280px!important}.cap,.prog,.foot{max-width:560px!important}}
.sl .scr .body{flex:1;min-height:0;overflow:hidden;position:relative}
.sl .scr .body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(rgba(255,255,244,0),var(--chip));pointer-events:none}
.sl:not(.on){opacity:.42;pointer-events:none}
.sl:not(.on) .scr{filter:saturate(.6)}
.cap{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;max-width:420px;width:100%;margin:12px auto 0}
.cap b{font:700 22px/1.05 "Bricolage Grotesque",system-ui,sans-serif}
.cap p{margin:0;grid-column:1;color:var(--soft);font-size:14px;line-height:1.3}
.cap a{grid-row:1/3;grid-column:2;font:700 11px/1 "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;padding:12px 12px;border:1.5px solid #DB6830;background:#DB6830;color:#fff;white-space:nowrap}
.cap a:hover{background:#B9531F;border-color:#B9531F}
.prog{display:flex;gap:4px;max-width:420px;width:100%;margin:10px auto 0}
.prog button{flex:1;height:5px;border:0;padding:0;color:var(--ink);background:var(--rule);cursor:pointer;position:relative;overflow:hidden}
.prog button i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.prog button.done i{transform:scaleX(1)}
.prog button.run i{animation:fill var(--dur,5s) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.foot{max-width:420px;width:100%;margin:8px auto 0;display:flex;justify-content:space-between;color:var(--soft)}
.foot button{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:0;cursor:pointer;padding:4px 0}
.bsn .bsl a.hl:not([aria-current]){background:#F9D9C2!important;color:#3E4A80!important;box-shadow:inset 0 -3px 0 #DB6830;transition:background .3s}

/* slide pieces */
.rtg{display:inline-block;font:500 9.5px/1.15 "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.05em;text-transform:uppercase;padding:4px 6px;border:1.5px solid var(--ink);white-space:nowrap;vertical-align:middle;text-decoration:none}
.scr{border:1.5px solid var(--ink);background:var(--chip);box-shadow:5px 5px 0 var(--rule);padding:10px;position:relative;overflow:hidden}
.scr .bar{display:flex;justify-content:space-between;font:500 9px "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:-2px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{display:flex;flex-direction:column;border:1.5px solid var(--ink);background:var(--paper);min-height:96px;text-decoration:none;color:var(--ink)}
.tile .in{padding:6px 6px 4px;flex:1;display:flex;flex-direction:column}
.tile b{font:700 15px/1.02 "Bricolage Grotesque",system-ui,sans-serif;display:flex;justify-content:space-between;gap:4px}
.tile b small{font:500 8.5px/1.1 "JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--accent);text-align:right}
.tile .in>span{margin-top:auto;padding-top:6px;font-size:10.5px;line-height:1.25;color:var(--soft)}
.tile .sb{display:flex;height:10px;flex:none;border-top:1.5px solid var(--ink)}
.tile .sb u{display:block}
.tile:hover{background:#FFFDE8}
.fade .tiles{opacity:.3;filter:saturate(.5);pointer-events:none}
.mcard{position:relative;margin:-62px 8px 0;border:1.5px solid var(--ink);background:var(--chip);box-shadow:4px 4px 0 var(--rule);padding:10px}
.mcard h4{font:700 24px/1 "Bricolage Grotesque",system-ui,sans-serif;margin:0}
.mcard .sub{font:500 9.5px "JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--soft);margin:4px 0 8px;letter-spacing:.04em}
.cells{display:grid;grid-template-columns:1.4fr 1fr;border:1.5px solid var(--ink);margin-bottom:8px}
.cells div{padding:4px 6px;border-right:1.5px solid var(--ink)}
.cells div:last-child{border-right:0}
.cells small,.dg small{display:block;font:500 8.5px "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:500}
.cells b{font-size:13.5px}
.rl{list-style:none;margin:0;padding:0}
.rl li{display:flex;flex-wrap:wrap;gap:3px 7px;align-items:center;padding:2px 0;font-size:12.5px;line-height:1.3}

.macts a,.macts button{flex:1;text-align:center;font:500 10.5px "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;padding:8px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none}
.macts button{background:#F9D9C2}
.fp .ban{display:grid;grid-template-columns:1fr 22px;gap:10px;border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin-bottom:4px}
.fp .ban b{font:700 26px/1 "Bricolage Grotesque",system-ui,sans-serif;display:block}
.fp .ban em{font-style:normal;font-size:13px;display:block;margin:4px 0 6px}
.fp .ban .vb{display:flex;flex-direction:column;border:1.5px solid var(--ink)}
.fp .ban .vb u{display:block}
.fp h5{font:500 9px "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:9px 0 5px}
.fp ol{list-style:none;margin:0 0 0 4px;padding:0;border-left:1.5px solid var(--ink)}
.fp ol li{padding:0 0 6px 11px;position:relative;font-size:12.5px;line-height:1.3}
.fp ol li::before{content:"";position:absolute;left:-5px;top:3px;width:8px;height:8px;background:var(--accent)}
.fp ol li b{display:block;font:500 9px "JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.fp .ns{font-size:12.5px;line-height:1.42;margin:0}
.fp .wd2{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);margin-top:9px;font-size:12px;line-height:1.3}
.fp .wd2 div{padding:6px}
.fp .wd2 div+div{border-left:1.5px solid var(--ink)}
.fp .wd2 small{display:block;font:500 8.5px "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.dcol{display:grid;gap:8px}
.dcard{border:1.5px solid var(--ink);background:var(--paper)}
.dcard .dh{padding:8px 8px 6px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dcard .dh b{font:700 18px/1 "Bricolage Grotesque",system-ui,sans-serif}
.dcard .dh span{font-size:11.5px;color:var(--soft);text-align:right}
.dcard .hero{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 8px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.dcard .hero b{font:700 19px/1.05 "Bricolage Grotesque",system-ui,sans-serif;text-align:right}
.dg{display:grid;grid-template-columns:1fr 1fr}
.dg div{padding:5px 8px;font-size:12.5px;font-weight:600}
.dg div:nth-child(odd){border-right:1.5px solid var(--ink)}
.dg div:nth-child(-n+2){border-bottom:1.5px solid var(--ink)}
.dcard .sb{display:flex;height:7px;border-top:1.5px solid var(--ink)}
.dcard .sb u{display:block}
.calc .row{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);margin-bottom:10px;background:var(--paper)}
.calc .row div{padding:5px 7px;border-right:1.5px solid var(--ink)}
.calc .row div:last-child{border-right:0}
.calc .row small{display:block;font:500 8.5px "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.calc .row b{font-size:15px}
.calc svg{display:block;width:100%;height:auto}
.calc .math{font:500 11px/1.55 "JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--soft);margin:8px 0 0}
.calc .math b{color:var(--accent);font-weight:500}
.mcard.solo{margin:0;box-shadow:none}
.fprow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.cardstripe{display:flex;height:9px;border:1.5px solid var(--ink);margin:0 0 8px}
.cardstripe u{display:block}
.wd3{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);margin-top:8px;font-size:12px;line-height:1.3}
.wd3 div{padding:6px}.wd3 div+div{border-left:1.5px solid var(--ink)}
.wd3 small{display:block;font:500 8.5px "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.bw h4,.sp h4,.pr h4,.am h4,.md h4{font:700 22px/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 2px}
.hw{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.hw li{display:grid;grid-template-columns:18px 1fr;gap:7px;font-size:12.5px;line-height:1.3}
.hw li>b{display:grid;place-items:center;width:18px;height:18px;border:1.5px solid var(--ink);font:500 10px "JetBrains Mono",monospace}
.hw small,.mkl small,.sl2 small,.tiers small{display:block;font:500 9px "JetBrains Mono",monospace;color:var(--soft);letter-spacing:.03em;margin-top:1px}
.nst{margin:0;font-size:12.5px;line-height:1.42}
.tiers ol{list-style:none;margin:0 8px 8px;padding:0;display:grid;gap:3px}
.tiers li{display:grid;grid-template-columns:16px 1fr;gap:6px;font-size:12px;line-height:1.3}
.tiers .tn{display:grid;place-items:center;width:16px;height:16px;background:var(--ink);color:#FFFFE2;font:500 9px "JetBrains Mono",monospace}
.mkl{border:1.5px solid var(--ink)}
.mkl>div{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:6px;align-items:center;padding:5px 7px;font-size:12px;line-height:1.25}
.mkl>div+div{border-top:1px solid var(--rule)}
.mkl .sy{font-size:12px;text-align:center}
.mkl .nm{text-align:right;font:500 9.5px/1.4 "JetBrains Mono",monospace;white-space:nowrap}
.mkl .nm i{font-style:normal;color:var(--soft);margin:0 3px 0 6px;text-transform:uppercase;font-size:8px;letter-spacing:.08em}
.mkl .nm i.bd{color:#C0392B}
.sl2 li{display:block!important;padding:6px 2px!important}
.st1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.st1 b{font-weight:600;font-size:13.5px}
.st1 .dz{margin-left:auto;font:500 10px "JetBrains Mono",monospace;color:var(--soft)}
.sl2 small{font:400 12px/1.35 Hanken Grotesk,system-ui,sans-serif!important;letter-spacing:0!important;margin-top:3px}
.rtg{display:inline-block;font:500 9px/1.15 "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.05em;text-transform:uppercase;padding:3px 5px;border:1.5px solid var(--ink);white-space:nowrap}
.lets{display:flex;flex-wrap:wrap;gap:6px}
.lets span{display:inline-flex;align-items:center;gap:3px;font:500 11px "JetBrains Mono",monospace;color:var(--soft)}
.lets span b{display:grid;place-items:center;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:50%;font:600 11px "JetBrains Mono",monospace}
.tchips .cnt{border:0!important;background:none!important;padding:0 6px 0 0!important;font:500 10px "JetBrains Mono",monospace;color:var(--soft)}
.labl{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);font-size:11px;line-height:1.25;color:var(--soft)}
.labl div{padding:6px 7px}
.labl div+div{border-left:1.5px solid var(--ink)}
.labl b{display:block;font:700 20px/1 Bricolage Grotesque,system-ui,sans-serif;color:var(--ink);margin-bottom:2px}
.coa{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);font-size:12px;line-height:1.3}
.coa div{padding:6px 7px;border-bottom:1px solid var(--rule)}
.coa div:nth-child(odd){border-right:1.5px solid var(--ink)}
.coa b{display:block;font:500 8.5px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#4F7A2B;margin-bottom:1px}

.lbl{display:block;font:500 9px "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:10px 0 5px}
.tchips{display:flex;flex-wrap:wrap;gap:5px}

    var p=PAGES[cur];$('#cap').innerHTML='<b>'+p[1]+'</b><p>'+p[2]+'</p><a href="'+(p[4]||p[0])+'" data-open="'+p[1]+'">'+p[3]+' →</a>';
    $('#prog').innerHTML=PAGES.map(function(q,k){return '<button type="button" data-k="'+k+'" aria-label="'+q[1]+'" class="'+(k<cur?'done':k===cur&&!paused?'run':k===cur?'done':'')+'" style="--dur:'+durOf(k)+'ms"><i></i></button>'}).join('');
    if(cur===4&&box&&o.seq)draw({o:o,note:'',np:null});else LV=null;
    if(cur===0){if(!LS.on){LS.on=true;LS.t0=performance.now()+1300}}else{LS.on=false;var lg=document.getElementById('lbgr');if(lg)lg.style.transform=''}
    clearTimeout(timer);if(!paused)timer=setTimeout(function(){go(cur+1)},durOf(cur));
  }
  function start(){if(started)return;started=true;
    build();go(0);requestAnimationFrame(frame);requestAnimationFrame(lscroll);
    var tries=0;(function wait(){if(document.querySelector('.bsn')){navHL()}else if(tries++<40)setTimeout(wait,50)})();
    addEventListener('bs-text',function(){if(cur===4&&box&&o.seq)draw({o:o,note:'',np:null})});
    addEventListener('resize',function(){place();if(cur===4&&box&&o.seq)draw({o:o,note:'',np:null})});
  }
  function user(i){paused=true;$('#pause').textContent='Play';go(i,true);T('home-gallery:'+PAGES[(i+8)%8][1],'Gallery '+PAGES[(i+8)%8][1])}
  $('#next').addEventListener('click',function(){user(cur+1)});
  $('#prev').addEventListener('click',function(){user(cur-1)});
  $('#pause').addEventListener('click',function(){paused=!paused;this.textContent=paused?'Play':'Pause';go(cur,true)});
  $('#prog').addEventListener('click',function(e){var b=e.target.closest('button');if(b)user(+b.dataset.k)});
  $('#cap').addEventListener('click',function(e){var a=e.target.closest('a');if(a)T('home-open:'+a.dataset.open,'Open '+a.dataset.open)});
  /* swipe; tapping a side card brings it forward */
  (function(){var g=$('#gal'),sx=null,sy=0,moved=false;
    g.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false},{passive:true});
    g.addEventListener('touchend',function(e){if(sx==null)return;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;if(Math.abs(dx)>45&&Math.abs(dx)>1.5*Math.abs(dy)){moved=true;user(cur+(dx<0?1:-1))}},{passive:true});
    g.addEventListener('click',function(e){var s=e.target.closest('.sl');if(!s)return;if(moved){e.preventDefault();moved=false;return}var i=+s.dataset.i;if(i!==cur){e.preventDefault();user(i)}else T('home-card-open:'+PAGES[i][1],'Card '+PAGES[i][1])});
    document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')user(cur+1);else if(e.key==='ArrowLeft')user(cur-1)});
  })();
  if('IntersectionObserver' in window)new IntersectionObserver(function(es){es.forEach(function(e){vis=e.isIntersecting})}).observe($('#gal'));
  document.addEventListener('visibilitychange',function(){if(document.hidden)clearTimeout(timer);else if(!paused&&started)go(cur,true)});

  /* the count, ticking up */
  (function(){var b=$('#ncount'),n=D.length,v=Math.max(0,n-Math.max(6,Math.round(n*.1)));if(RM){b.textContent=n;return}b.textContent=v;
    (function step(k){if(v>=n)return;setTimeout(function(){v++;b.textContent=v;b.classList.remove('tick');void b.offsetWidth;b.classList.add('tick');step(k+1)},120+k*k*12)})(0)})();
});
})();
</script>
