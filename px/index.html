async function open_(pw){
 const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(BLOB.s),iterations:BLOB.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(BLOB.i)},k,u(BLOB.c));
 return JSON.parse(new TextDecoder().decode(pt))}
async function unlock(pw,remember){let d;try{d=await open_(pw)}catch(e){return false}
 document.getElementById('lock').remove();document.getElementById('main').innerHTML=d.html;new Function(d.js)();
 if(remember)try{localStorage.setItem('px',pw)}catch(e){};return true}
document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const ok=await unlock(document.getElementById('pw').value,true);if(!ok)document.getElementById('err').hidden=false};
