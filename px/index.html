<style>
/* Layout v5: simple price list grouped by use; checkout screen holds friend pricing, gifts, syringe estimate. Tick rows to build an order; view chips hide columns for screenshots; order + WhatsApp text at the bottom */
:root{--paper:#FFFFE2;--chip:#FFFFF4;--ink:#3E4A80;--soft:#6B76A8;--rule:#E3E0BF;--act:#DB6830;--ok:#2F6B46;--ok2:#4F7A2A;
--g:#79A54D;--gt:#EEF5E6;--v:#B493E8;--vt:#F3EEFC;--b:#99ACFF;--bt:#EAF0FF;--sel:#FFF3B0;
--display:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 13.5px/1.4 var(--body);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 90px}
.r{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.hi{font:700 22px/1.1 var(--display);margin:0}
.sub{color:var(--soft);font-size:12px;margin:-4px 0 0}
input[type=search]{width:100%;border:1.5px solid var(--ink);border-radius:9px;background:var(--chip);color:var(--ink);font:15px var(--body);padding:7px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.chips .lb{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-right:2px}
.chips button{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:20px;padding:3px 10px;font:600 12px var(--body);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
h2{font:700 15px var(--display);margin:8px 0 0;display:flex;align-items:center;gap:7px}h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
h2 small{font:500 11px var(--mono);color:var(--soft)}
.g{--c:var(--g);--t:var(--gt)}.v{--c:var(--v);--t:var(--vt)}.b{--c:var(--b);--t:var(--bt)}
.hr,.it{display:grid;grid-template-columns:16px 1fr 22px var(--cols);gap:6px;align-items:baseline}
.hr{background:var(--t);border-bottom:2px solid var(--c);padding:5px 6px 3px;border-radius:6px 6px 0 0}
.hd{font:600 10px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.it{padding:5px 6px;border-bottom:1px solid var(--rule);cursor:pointer}
.it.on{background:var(--sel)}
.it input{width:15px;height:15px;margin:0;accent-color:var(--ink);align-self:center}
.nm{font-weight:600;min-width:0}.nm small{font-weight:400;color:var(--soft);font-size:11.5px;margin-left:4px;white-space:nowrap}
.p{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.lf{font:500 11px var(--mono);color:var(--soft);text-align:right}
.f1{color:var(--ok2)}.f2{color:var(--ok);font-weight:600}
sup{font:600 7.5px var(--body);color:var(--soft)}
.qty{display:inline-flex;align-items:center;gap:4px;margin-left:6px;vertical-align:1px}
.qty button{width:20px;height:19px;border-radius:5px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font-size:12px;line-height:1;padding:0;cursor:pointer}
.qty span{font:600 11.5px var(--mono);min-width:14px;text-align:center}
body.m0 .c-f,body.m0 .c-c,body.m1 .c-c{display:none}
.order{border-top:2px solid var(--ink);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.row{display:flex;justify-content:space-between;font-size:13px}.row b{font-family:var(--mono);font-weight:500}
.row.disc{color:var(--ok)}.row.big{font:700 17px var(--display)}.row.big b{font-weight:600}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 12px;font:600 13px var(--body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.acts{display:grid;grid-template-columns:2fr 1fr;gap:8px}
textarea{width:100%;border:1px solid var(--rule);border-radius:9px;background:var(--chip);color:var(--ink);font:12px/1.4 var(--body);padding:8px;resize:vertical}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);padding:9px max(14px,env(safe-area-inset-right,0px)) calc(9px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;font:600 13.5px var(--body);z-index:5}
.bar a{color:var(--paper);font:600 12.5px var(--body);border:1.5px solid var(--paper);border-radius:8px;padding:5px 10px;text-decoration:none}
.bar b{font-family:var(--mono)}
.foot{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--soft)}
button:focus-visible,input:focus-visible{outline:2px solid var(--act);outline-offset:2px}
input[type=text]{width:100%;border:1.5px solid var(--ink);border-radius:9px;background:var(--chip);color:var(--ink);font:15px var(--body);padding:8px 10px}
.cotop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ol{display:grid;grid-template-columns:1fr auto auto 76px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule);font-size:13px}
.ol b{font:500 12.5px var(--mono);text-align:right}.ol.gf b{color:var(--ok)}.ol .qty{margin:0}
.gt{border:1.5px solid var(--ok);background:transparent;color:var(--ok);border-radius:14px;padding:2px 8px;font:600 11px var(--body);cursor:pointer}
.gt[aria-pressed=true]{background:var(--ok);color:#fff}
.bar button{background:var(--paper);color:var(--ink);border:0;border-radius:8px;padding:6px 11px;font:700 13px var(--body);cursor:pointer}
.btn.sold{background:var(--ok);padding:11px}

.grp{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:8px 6px 2px}
.est{font-size:12px;color:var(--soft);margin:-2px 0 4px;padding-left:2px}
.est input{width:52px;border:1px solid var(--rule);border-radius:5px;background:var(--chip);color:var(--ink);font:12px var(--mono);padding:1px 4px}
.syr{background:var(--bt);border-radius:8px;padding:8px 10px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.syr button{border:1.5px solid var(--ink);background:var(--chip);color:var(--ink);border-radius:7px;padding:4px 9px;font:600 12px var(--body);cursor:pointer;white-space:nowrap}
.fl{font-size:11px;color:var(--ok);display:block}
.f1{color:var(--ok2)}.f2{color:var(--ok);font-weight:600}.capd{color:var(--act)}
.nm small{white-space:normal!important}.nm{overflow-wrap:anywhere}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}details summary h2::after{content:'▸ tap to open';font:500 11px var(--body);color:var(--soft);margin-left:auto}details[open] summary h2::after{content:'▾ hide'}

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
 const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(BLOB.s),iterations:BLOB.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(BLOB.i)},k,u(BLOB.c));
 return JSON.parse(new TextDecoder().decode(pt))}
async function unlock(pw,remember){let d;try{d=await open_(pw)}catch(e){return false}
 document.getElementById('lock').remove();document.getElementById('main').innerHTML=d.html;new Function(d.js)();
 if(remember)try{localStorage.setItem('px',pw)}catch(e){};return true}
document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const ok=await unlock(document.getElementById('pw').value,true);if(!ok)document.getElementById('err').hidden=false};
(async()=>{let s=null;try{s=localStorage.getItem('px')}catch(e){};if(s)await unlock(s,false)})();
