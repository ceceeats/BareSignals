<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>Bare Signals</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a friendly note on site paper. One column, phone first: kit, plan, total, copy for WhatsApp */
:root{--paper:#FFFFE2;--chip:#FFFFF4;--ink:#3E4A80;--soft:#6B76A8;--rule:#E3E0BF;--line:#E1DE62;--act:#DB6830;--sy:#F2792E;
--ok:#2F6B46;--okbg:#E6F3DD;--waive:#9AA0BE;
--display:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 13.5px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px 24px}
.r{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.hi{font:700 21px/1.15 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--soft);font-size:13px;margin:-4px 0 2px}
h2{font:700 14.5px var(--display);margin:10px 0 0}
.item{display:grid;grid-template-columns:18px 1fr auto auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--rule)}
.item input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink);margin:0}
.nm{font:600 13.5px var(--body);min-width:0}.nm small{font:400 12px var(--body);color:var(--soft);margin-left:5px}.nm small{white-space:nowrap}
.pr{font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap}
.item.off .nm,.item.off .pr{opacity:.38}
.qty{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty button{width:22px;height:20px;border-radius:6px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font-size:13px;line-height:1;cursor:pointer;padding:0}
.qty span{font-family:var(--mono);font-size:12px;min-width:18px;text-align:center}
.rec{color:var(--ok);font:600 10.5px var(--body);margin-left:5px}
.free .pr{color:var(--ok);font-weight:600}
s{color:var(--waive)}
.row{display:flex;justify-content:space-between;font-size:13px}.row b{font-family:var(--mono);font-weight:500}
.row.disc{color:var(--ok)}
.row.big{font:700 16px var(--display);padding-top:4px;border-top:1.5px solid var(--ink)}.row.big b{font-weight:600;font-size:15px}
.plan{font-size:12.5px}.plan p{margin:0 0 5px}
.plan .d{font-weight:600}
.u{font-family:var(--mono);font-weight:600;color:var(--sy)}
.bank{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.bank .n{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.03em}
.bank small{display:block;color:var(--soft);font-size:11.5px}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:8px;padding:7px 12px;font:600 12.5px var(--body);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.acts .btn{padding:9px 6px}
textarea{width:100%;min-height:110px;border:1px solid var(--rule);border-radius:9px;background:var(--chip);color:var(--ink);font:12px/1.4 var(--body);padding:8px}
.foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--soft);font-family:var(--mono);margin-top:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--act);outline-offset:2px}

.col{display:block}.it,.hr{display:grid;grid-template-columns:1fr 24px 52px 52px 52px;gap:6px;align-items:baseline}.it{padding:5px 0;border-bottom:1px solid var(--rule)}.hr{border-bottom:1.5px solid var(--ink);padding:6px 0 2px}.addon .it,.addon .hr{grid-template-columns:1fr 70px}
.hd{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.p{font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap}
.fp{color:var(--ok)}
.nm small{white-space:normal}.sec{display:flex;align-items:center;gap:8px}.sec::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.cnt{font:600 11px var(--mono);color:var(--soft)}
.g{--c:#79A54D;--t:#EEF5E6}.o{--c:#FFA51F;--t:#FFEEDD}.v{--c:#B493E8;--t:#F3EEFC}.b{--c:#99ACFF;--t:#EAF0FF}
.col .hr{background:var(--t);border-bottom:2px solid var(--c);padding:6px 6px 3px;border-radius:6px 6px 0 0}
.col .it{padding-left:6px;padding-right:6px}
.tabs button[data-t="In stock"]{border-color:#79A54D}.tabs button[data-t="Pending"]{border-color:#FFA51F}.tabs button[data-t="Pre-order"]{border-color:#B493E8}
.tabs button[data-t="In stock"][aria-pressed=true]{background:#79A54D;color:#fff}.tabs button[data-t="Pending"][aria-pressed=true]{background:#FFA51F;color:#3E4A80}.tabs button[data-t="Pre-order"][aria-pressed=true]{background:#B493E8;color:#fff}
.fp{color:var(--ok);font-weight:600}.fp1{color:#4F7A2A}sup{font:600 8px var(--body);color:var(--soft);margin-left:1px}
.lf{font:500 11.5px var(--mono);color:var(--soft);text-align:right}.addon{grid-template-columns:1fr auto}
input[type=search]{width:100%;border:1.5px solid var(--ink);border-radius:9px;background:var(--chip);color:var(--ink);font:14px var(--body);padding:8px 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:20px;padding:4px 11px;font:600 12px var(--body);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

</style></head><body>

<button class="btn" type="submit" style="margin-top:8px;width:100%">Open</button></form><p class="sub" id="err" hidden style="color:#A8261C">Wrong passcode.</p></div>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
 const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(BLOB.s),iterations:BLOB.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(BLOB.i)},k,u(BLOB.c));
 return JSON.parse(new TextDecoder().decode(pt))}
function start(d){const D=d.rows;


const G=[['In stock','In stock','g'],['Pending','Arriving','o'],['Pre-order','Pre-order','v']];
const f=n=>Math.round(n/1000).toLocaleString('en-US');
let tab='all';
function draw(){const q=document.getElementById('q').value.trim().toLowerCase();let h='';
 G.forEach(([k,lab,c])=>{if(tab!=='all'&&tab!==k)return;
  const r=D.filter(x=>x.st===k&&(x.n+' '+x.s).toLowerCase().includes(q));if(!r.length)return;
  h+=`<h2 class="sec ${c}">${lab}<span class="cnt">${r.length}</span>${k==='Pre-order'?'<span class="cnt">· 2 weeks to a month</span>':''}</h2><div class="col ${c}"><div class="hr"><span class="hd">Peptide</span><span class="hd p">${k==='Pending'?'Due':k==='In stock'?'Left':''}</span><span class="hd p">Price</span><span class="hd p">Friend</span><span class="hd p">Close</span></div>`+
   r.map(x=>`<div class="it"><span class="nm">${x.n}<small>${x.s}</small></span><span class="lf">${k!=='Pre-order'&&x.left?x.left:''}</span><span class="p">${f(x.p)}</span><span class="p fp1">${f(x.f)}</span><span class="p fp">${f(x.c)}${x.cap<0.3?'<sup>cap</sup>':''}</span></div>`).join('')+'</div>'});
 document.getElementById('list').innerHTML=h||'<p class="sub">No match.</p>'}
document.getElementById('q').oninput=draw;
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});

draw()}
async function unlock(pw,remember){let d;try{d=await open_(pw)}catch(e){return false}
 const m=document.getElementById('main');m.innerHTML=d.html;document.getElementById('lock').hidden=true;m.hidden=false;start(d);
 if(remember)try{localStorage.setItem('px',pw)}catch(e){};return true}
document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const ok=await unlock(document.getElementById('pw').value,true);document.getElementById('err').hidden=ok};
(async()=>{let s=null;try{s=localStorage.getItem('px')}catch(e){};if(s)await unlock(s,false)})();
</script></body></html>
