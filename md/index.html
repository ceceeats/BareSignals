<style>
/* Medan Prices v11: Batch tests link added; v10: v9 look plus discount picker (Full, 10 to 50%), cap = Lowest for every item, BAC water never discounted */
:root{--paper:#FFFFE2;--chip:#FFFFF4;--ink:#3E4A80;--soft:#6B76A8;--rule:#E3E0BF;--act:#DB6830;--b:#99ACFF;--bt:#EAF0FF;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.35 "Hanken Grotesk",system-ui,sans-serif;padding:14px max(14px,env(safe-area-inset-left)) 40px}
.r{max-width:520px;margin:0 auto}
h1{font:700 22px/1.1 "Bricolage Grotesque",sans-serif;margin:0 0 2px}.sub{color:var(--soft);font-size:12px;margin:0 0 8px}
.lv{position:sticky;top:0;z-index:3;background:var(--paper);display:flex;gap:5px;align-items:center;padding:4px 0 6px;flex-wrap:wrap}
.lv span{font:600 10px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);margin-right:2px}
.lv button{border:1.5px solid var(--act);color:var(--act);background:transparent;border-radius:20px;padding:3px 9px;font:600 12.5px "Hanken Grotesk",sans-serif;cursor:pointer}
.lv button[aria-pressed=true]{background:var(--act);color:#FFFFF4}
.hd,.it{display:grid;grid-template-columns:1fr 24px 46px 58px;gap:4px;align-items:baseline}
.hd{position:sticky;top:34px;background:var(--bt);border-bottom:2px solid var(--b);padding:6px 6px 4px;border-radius:6px 6px 0 0;font:600 10px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);z-index:2}
h2{font:700 14px "Bricolage Grotesque",sans-serif;margin:10px 0 2px 6px}
.it{padding:4px 6px;border-bottom:1px solid var(--rule)}
.n{font-weight:600;min-width:0}.n i{font-style:normal;font-weight:400;color:var(--soft);font-size:12px;white-space:nowrap}
.n em{font:600 9.5px "JetBrains Mono",monospace;font-style:normal;color:var(--soft);border:1px solid var(--rule);border-radius:4px;padding:0 4px;white-space:nowrap}
.q,.p{text-align:right;font:500 13px "JetBrains Mono",monospace;white-space:nowrap}.q{color:var(--soft);font-size:12px}
.o{color:#2F6B46}.p small{display:block;font:500 9.5px/1 "Hanken Grotesk",sans-serif;color:var(--act)}
.tot{margin-top:12px;border:1.5px solid var(--ink);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.tot div{display:flex;justify-content:space-between;font-weight:600}.tot b{font:600 15px "JetBrains Mono",monospace}
.ft{color:var(--soft);font-size:11.5px;margin:8px 2px 0}.bt{display:block;margin:10px 2px 0;color:#3D6BE0;font-weight:600;text-decoration:underline}
#lock{max-width:320px;margin:30vh auto 0;display:flex;flex-direction:column;gap:8px}
#lock input{font:16px "Hanken Grotesk",sans-serif;border:1.5px solid var(--ink);border-radius:9px;background:var(--chip);color:var(--ink);padding:8px 10px}
#lock button{font:600 15px "Hanken Grotesk",sans-serif;border:1.5px solid var(--act);color:var(--act);background:transparent;border-radius:9px;padding:8px}
#err{color:#B23A2E;font-size:12px}
</style></head><body>
