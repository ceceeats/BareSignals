<style>

:root{--paper:#FFFFE2;--chip:#FFFFF4;--ink:#3E4A80;--soft:#6B76A8;--rule:#E3E0BF;--act:#DB6830;--b:#99ACFF;--bt:#EAF0FF;color-scheme:light}

.q,.p{text-align:right;font:500 13px "JetBrains Mono",monospace;white-space:nowrap}.q{color:var(--soft);font-size:12px}
.o{color:#2F6B46}sup{font-size:9px;color:var(--act)}.n em{font:600 9.5px 'JetBrains Mono',monospace;font-style:normal;color:var(--soft);border:1px solid var(--rule);border-radius:4px;padding:0 4px;white-space:nowrap}.cp{display:block;font-size:11px;color:var(--act);font-weight:400}
.tot{margin-top:12px;border:1.5px solid var(--ink);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.tot div{display:flex;justify-content:space-between;font-weight:600}.tot b{font:600 15px "JetBrains Mono",monospace}
.ft{color:var(--soft);font-size:11.5px;margin:8px 2px 0}

#lock input{font:16px "Hanken Grotesk",sans-serif;border:1.5px solid var(--ink);border-radius:9px;background:var(--chip);color:var(--ink);padding:8px 10px}
#lock button{font:600 15px "Hanken Grotesk",sans-serif;border:1.5px solid var(--act);color:var(--act);background:transparent;border-radius:9px;padding:8px}
#err{color:#B23A2E;font-size:12px}
</style></head><body>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function op(pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(BLOB.s),iterations:BLOB.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(BLOB.i)},k,u(BLOB.c))))}
async function un(pw,rem){let d;try{d=await op(pw)}catch(e){return false}
document.getElementById('lock').remove();document.getElementById('c').innerHTML=d.html;document.getElementById('main').hidden=false;
if(rem)try{localStorage.setItem('md',pw)}catch(e){};return true}
document.getElementById('lock').onsubmit=async e=>{e.preventDefault();if(!await un(document.getElementById('pw').value,true))document.getElementById('err').hidden=false};
(async()=>{let s=null;try{s=localStorage.getItem('md')}catch(e){};if(s)await un(s,false)})();
