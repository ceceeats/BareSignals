<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Scan test 10 · Bare Signals</title>
<style>body{margin:0;background:#FFFFE2;color:#3E4A80;font:15px/1.45 system-ui,sans-serif;padding:24px 16px}a{color:#3E4A80;font-weight:600}</style>
<script src="/scan/v9/data.js"></script>
<script src="/scan/v10/vials.js"></script>
</head><body>
<p id="m">Loading 10 test scans…</p>
<script>
/* Scan test 10 (28 Oct 2026): pretends a person scanned 10 vials in a row with no
   edits, so the My protocol list can be judged for navigation. Picked for range:
   weekly mg, daily mcg, big-volume powders, a ready-made liquid in mL, IU units,
   an oral capsule, a nasal spray, a blend, and one with no common dose.
   Your own list is backed up first; open /scan/test10/#restore to put it back. */
(function(){
  const KEY='bs-scan-v1',BAK='bs-scan-v1-backup-test10';
  /* v10 mock time picks (Cece, 28 Oct): NAD+ morning; Retatrutide morning after food; Selank anytime;
     BPC-157 + TB-500 every other day. Added to show the other groups: BPC-157 morning fasted, Glutathione and HCG at night. */
  const MOCK={NAD:{tm:{a:'☀ AM'}},RTA:{tm:{a:'☀ AM',b:'After food'}},BTB:{f:'EOD',dy:[0,2,4,6]},BPC:{f:'5on2',dy:[0,1,2,3,4],tm:{a:'☀ AM',b:'Fasted'}},GSH:{tm:{a:'☾ PM'}},HCG:{tm:{a:'☾ PM'}}};
  const CODES=['RTA','BPC','GSH','NAD','CRB','HCG','MK','SLK','BTB','LMB'];
  const m=document.getElementById('m');
  try{
    if(location.hash==='#restore'){
      const b=localStorage.getItem(BAK);
      if(b){localStorage.setItem(KEY,b);localStorage.removeItem(BAK);m.innerHTML='Your own list is back. <a href="/S/RTA/#list">Open My protocol</a>'}
      else m.textContent='No backup on this phone, nothing to restore.';
      return}
    const cur=localStorage.getItem(KEY);
    if(cur&&!localStorage.getItem(BAK))localStorage.setItem(BAK,cur);
    const old=JSON.parse(cur||'null')||{};
    const IT=(window.BS_SCAN||{}).items||{};const now=Date.now();
    /* ?v=10 opens the v10 preview with the stock vial sizes; plain link keeps v9 */
    const V10=/[?&]v=10\b/.test(location.search),VS=V10?(window.BS_VIALS||{}):{};
    const dv=(c,x)=>{const u=VS[c];return u&&u.length?(u.indexOf(x.vm)>=0?x.vm:u[0]):(x.vm||'')};
    const items=CODES.filter(c=>IT[c]).map((c,i)=>{const x=IT[c];const g=V10&&c==='GSH';const mk=V10?(MOCK[c]||{}):{};return {c,dose:g?'200 mg':(x.st||''),f:mk.f||(g?'3W':(x.f||'D')),dy:mk.dy,tm:mk.tm,vm:dv(c,x),vw:x.vw||'',added:now-(CODES.length-i)*60000,taken:[]}});
    localStorage.setItem(KEY,JSON.stringify({items,log:[],consent:old.consent===undefined?null:old.consent}));
    location.replace(V10?'/scan/v10/?c='+CODES[CODES.length-1]+'#list':'/S/'+CODES[CODES.length-1]+'/#list');
  }catch(e){m.textContent='This browser blocked saving ('+e.message+'). Try in Safari or Chrome, not a private tab.'}
})();
</script>
</body></html>
