<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Bare Signals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--paper:#FFFFE2;--chip:#FFFFF4;--ink:#3E4A80;--soft:#6B76A8;--rule:#E3E0BF;--act:#DB6830;
--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:13.5px/1.45 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:var(--bs-w,1240px);margin:0 auto;padding:8px max(var(--bs-pad,16px),env(safe-area-inset-left,0px)) 8px;height:calc(100svh - var(--bsnav-h0,0px));display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;position:relative}
.lab{font:500 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
/* stage */
.stage{position:relative;min-height:0;background:var(--chip);border:1px solid var(--rule);overflow:hidden}
.xray{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.xray[hidden]{display:none}
.stbar{position:absolute;left:6px;right:6px;top:6px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;z-index:2;pointer-events:none}
.stbar>*{pointer-events:auto}
.seg{display:inline-flex;border:1px solid var(--act);background:var(--chip)}
.seg button,.zb{all:unset;cursor:pointer;font:500 9px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--act);padding:5px 7px}
.seg button[aria-pressed="true"]{color:var(--chip);background:var(--act)}
.zb{border:1px solid var(--act);background:var(--chip)}.zb[hidden]{display:none}
.zs{display:flex;gap:4px}
.cap{font:500 9px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);background:var(--chip);padding:4px 5px;max-width:55%}
/* body art: v9 figure */
.skinglow{fill:none;stroke:#C9A9B8;stroke-width:8;opacity:.4;transition:stroke .9s,opacity .9s}
.film.skin{mix-blend-mode:normal;fill:url(#skg);stroke:none}
.skinline{fill:none;stroke:#3B416E;stroke-width:1.15;opacity:.62;pointer-events:none;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.film{mix-blend-mode:multiply;fill-opacity:.28;stroke-opacity:.5;stroke-width:.8;vector-effect:non-scaling-stroke;transition:fill-opacity .9s ease,stroke-opacity .9s ease,fill .6s,stroke .6s}
.film[data-k=muscles]{fill-opacity:.06;stroke-opacity:.25}
.film[data-k=bones]{mix-blend-mode:normal;fill:#FFFDF6;fill-opacity:.36;stroke:#8E5A86;stroke-opacity:.45}
#head .film[data-k=brain]{fill-opacity:.12;stroke-opacity:.4}
.xray.lit .film{fill-opacity:.06;stroke-opacity:.15}
.xray.lit .film[data-k=bones]{fill-opacity:.2;stroke-opacity:.22}
.xray.lit .film.on{fill-opacity:.85;stroke-opacity:.95;animation:breathe 4s ease-in-out 1s infinite}
.xray.lit .film[data-k=bones].on{fill-opacity:.7}
.xray.lit .film[data-k=muscles].on{fill-opacity:.32;stroke-opacity:.55;animation:none}
.xray.lit .film.skin{fill-opacity:1}
.xray.lit .film.skin.on{fill:#FFDCD6;animation:none}
svg:has(.film.skin.on) .skinglow{stroke:#F08C8C;opacity:.85;stroke-width:14}
@keyframes breathe{50%{fill-opacity:.6}}
.film.ping{animation:ping 1.2s ease-in-out 2!important}
@keyframes ping{50%{fill-opacity:.35}}
.tagl,.mags{opacity:0;transition:opacity .5s}.show .tagl,.show .mags{opacity:1}
.mag{cursor:pointer}
/* controls */
.panel{display:grid;gap:7px;min-width:0}
.panel>*{min-width:0}
.srch{display:flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--chip);padding:0 8px;height:34px}
.srch input{all:unset;flex:1;min-width:0;font:500 14px var(--body);color:var(--ink)}
.srch input::placeholder{color:var(--soft);opacity:.85}
.srch .n{font:500 9px var(--mono);color:var(--soft);white-space:nowrap}
.srch button{all:unset;cursor:pointer;font:500 9px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--act)}
.rowh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.clr{all:unset;cursor:pointer;font:500 9px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--act)}.clr[hidden]{display:none}
.strip{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);gap:5px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;justify-content:start;padding-bottom:1px}
.strip::-webkit-scrollbar{display:none}
.sys{all:unset;cursor:pointer;font:500 9.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:6px 8px;white-space:nowrap;border:1px solid var(--ink);background:var(--chip);display:inline-flex;gap:6px;align-items:center}
.sys i{font-style:normal;opacity:.65}
.sys[aria-pressed="true"]{background:var(--ink);color:var(--chip)}
.rchip{all:unset;cursor:pointer;font:500 9px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:6px 7px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.rchip i{font-style:normal;opacity:.7}
.rchip[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.cchip{all:unset;cursor:pointer;font:500 12.5px/1 var(--body);padding:6px 8px 6px 6px;white-space:nowrap;border:1px solid var(--rule);background:var(--chip);display:inline-flex;gap:6px;align-items:center}
.cchip .sq,.sq{display:inline-block;width:10px;height:10px;border:1px solid rgba(62,74,128,.4);flex:none}
.cchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.empty{font-size:12.5px;color:var(--soft);padding:6px 0}
/* card */
.card{background:var(--chip);border:1px solid var(--rule);min-height:0;overflow:auto;overscroll-behavior:contain;display:none;-webkit-overflow-scrolling:touch}
.app.carding .card{display:block}
.stripe{display:flex;height:8px;position:sticky;top:0;z-index:1}
.chd{position:sticky;top:8px;z-index:1;background:var(--chip);padding:8px 12px 6px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;border-bottom:1px solid var(--rule)}
.chd h2{font:700 21px/1.05 var(--display);margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.ap{font:500 8.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--soft);color:var(--soft);padding:3px 5px;white-space:nowrap;position:relative;top:-2px}
.ap.ok{border-color:#79A54D;color:#4E7A28}
.fn{margin:0;font-size:13px;color:var(--soft);grid-column:1/-1}
.cnav{display:flex;gap:4px;align-items:flex-start}
.cnav button{all:unset;cursor:pointer;font:500 13px/1 var(--mono);color:var(--act);border:1px solid var(--act);padding:4px 7px}
.sec{padding:8px 12px 2px}
.sec h3{font:500 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:0 0 6px}
.roles{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.roles li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font:500 8.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 5px;white-space:nowrap}
.roles .t{font-size:13px;line-height:1.35;flex:1;min-width:150px}
.org{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px}
.org li{display:grid;grid-template-columns:10px 1fr;gap:7px;align-items:start;cursor:pointer;padding:2px 0}
.org li .sq{margin-top:4px}
.org b{font-weight:600}
.org span{font-size:13px;line-height:1.35}
.mech{margin:0;padding:0 0 0 18px;display:grid;gap:4px;font-size:13px;line-height:1.35}
.mech small{font:500 9px/1.3 var(--mono);color:var(--soft);display:block;letter-spacing:.02em}
.tst{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.tst li{font-size:12.5px;border:1px solid var(--rule);padding:3px 6px;line-height:1.3}
.tst li em{font:500 8.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-style:normal;margin-left:4px}
.dose{display:flex;flex-wrap:wrap;border:1px solid var(--rule)}
.dose div{padding:5px 8px;border-right:1px solid var(--rule);flex:1 1 auto}
.dose div:last-child{border-right:0}
.dose .lab{display:block;margin-bottom:3px}
.dose b{font:600 12.5px/1.25 var(--body)}
.go{display:inline-block;margin:10px 12px 12px;font:500 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--act);text-decoration:none;border:1px solid var(--act);padding:7px 9px}
.fine{font:500 8.5px/1.5 var(--mono);color:var(--soft);margin:0 12px 10px}
.foot{font:500 8px/1.4 var(--mono);color:var(--soft);margin:0}
/* phone with a card open: body keeps the top, card takes the rest */
@media (max-width:899px){
 .app.carding{grid-template-rows:minmax(0,44fr) minmax(0,56fr)}
 .app.carding .panel{display:none}
 .foot{display:none}
}
@media (min-width:900px){
 .app{grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);grid-template-rows:minmax(0,1fr)}
 .side{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;min-height:0}
 .app:not(.carding) .side{grid-template-rows:minmax(0,1fr) auto}
 .app:not(.carding) .panel{grid-template-rows:auto auto auto minmax(0,1fr);min-height:0}
 .app:not(.carding) .panel>div:last-child{display:flex;flex-direction:column;min-height:0}
 .app:not(.carding) #comps{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));overflow-y:auto;overflow-x:hidden;align-content:start;min-height:0}
 .app:not(.carding) #comps .cchip{white-space:normal;line-height:1.15}
 .strip{grid-template-rows:repeat(2,auto)}
 .chd h2{font-size:24px}
}
@media (max-width:899px){.side{display:contents}.app{grid-template-rows:minmax(0,1fr) auto auto}.card{grid-row:2}}
@media(prefers-reduced-motion:reduce){.film,.tagl,.mags{transition:none!important;animation:none!important}}

/* ---------- what lights up ---------- */
function headKeys(){return new Set([...$("head").querySelectorAll(".film")].map(e=>e.dataset.k));}
const HK=headKeys();
function litFor(){ // -> [{k,role,label,note}]
 const out=[],seen=new Set(),add=(k,role,label,note)=>{(ALIAS[k]||[k]).forEach(kk=>{if(seen.has(kk))return;seen.add(kk);out.push({k:kk,role,label:label||NAME[kk]||kk,note});});};
 if(st.comp){const c=st.comp;
  if(st.view==="head"){c.o.filter(e=>HK.has(e.k)).forEach(e=>add(e.k,e.r,e.at,e.note));
   if(!out.length)[...c.r,...c.x].forEach(r=>(HEAD[r]||[]).forEach(k=>add(k,r)));}
  else{c.o.forEach(e=>add(HEADONLY[e.k]||e.k,e.r,HEADONLY[e.k]?e.at:e.at,e.note));
   if(!out.length)c.r.forEach(r=>(BODY[r]||[]).forEach(k=>add(k,r)));}
  return out;}
 const roles=st.role?[st.role]:st.sys!=null?SYS[st.sys][1]:[];
 roles.forEach(r=>((st.view==="head"?HEAD:BODY)[r]||[]).forEach(k=>add(k,r)));
 return out;}
function clearFilms(s){s.querySelectorAll(".film").forEach(e=>{e.classList.remove("on");e.style.fill="";e.style.stroke="";});}
function light(list){const s=svgOf();clearFilms(s);s.classList.toggle("lit",list.length>0);const on=[];
 list.forEach((m,i)=>{s.querySelectorAll(`.film[data-k="${m.k}"]`).forEach(e=>{on.push(e);e.__m=m;const col=P[m.role]?P[m.role][1]:"#E3E0BF";
  setTimeout(()=>{if(!["bones","skin"].includes(m.k)){e.style.fill=col;e.style.stroke=col;}e.classList.add("on");},200+Math.min(i,6)*260);});});
 s.__on=on;s.__list=list;return on;}
/* ---------- tags: free placement, diagonal leaders ---------- */
const ANCH={skin:[.16,.27],muscles:[.66,.62],bones:[.35,.73]};
function drawTags(s){const t=s.querySelector(".tagl"),g=s.querySelector(".mags");t.innerHTML="";g.innerHTML="";
 const list=s.__list||[];if(!list.length)return;
 const V=vis(s),k=V.k,fs=(isPhone()?9.5:10.5)*k,th=fs*1.75,skin=s.querySelector('.film[data-k="skin"]');
 const inBody=(x,y)=>{try{return skin.isPointInFill(new DOMPoint(x,y))}catch(e){return false}};
 const rows=[],byLabel={};
 list.forEach(m=>{const els=[...s.querySelectorAll(`.film[data-k="${m.k}"]`)];if(!els.length)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;els.forEach(e=>{const b=e.getBBox();x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);});
  const L=m.label;if(byLabel[L])return;let ax=(x0+x1)/2,ay=(y0+y1)/2;
  if(ANCH[m.k]&&s.id!=="head"){ax=x0+(x1-x0)*ANCH[m.k][0];ay=y0+(y1-y0)*ANCH[m.k][1];}
  ax=Math.min(Math.max(ax,V.x+8*k),V.x+V.w-8*k);ay=Math.min(Math.max(ay,V.y+8*k),V.y+V.h-8*k);
  const r={L,role:m.role,ax,ay};byLabel[L]=r;rows.push(r);});
 rows.sort((a,b)=>a.ay-b.ay);
 const placed=[],cxm=V.x+V.w/2;let MG=null;
 if(s.id!=="head"&&(s.__on||[]).some(e=>["brain","brainstem","cerebellum","pituitary"].includes(e.dataset.k))){
  const br=s.querySelector('.film[data-k=brain]').getBBox(),R=15*k;MG={R,x:Math.max(br.x-R*1.6,V.x+R+4*k),y:Math.max(br.y+R*.2,V.y+R+34*k)};
  placed.push({box:{x0:MG.x-R,x1:MG.x+R,y0:MG.y-R,y1:MG.y+R},ex:MG.x,ey:MG.y,r:null});}
 const hit=(a,b)=>!(a.x1+3*k<b.x0||b.x1+3*k<a.x0||a.y1+2*k<b.y0||b.y1+2*k<a.y0);
 rows.forEach(r=>{const tw=r.L.length*fs*.64+fs*1.3;let best=null;
  for(const R of [34,56,82,112,150,195])for(let a=0;a<360;a+=15){const rad=a*Math.PI/180,dx=Math.cos(rad),dy=Math.sin(rad);
   const ex=r.ax+dx*R*k,ey=r.ay+dy*R*k,right=dx>=0||(Math.abs(dx)<.2&&r.ax<cxm);
   const box={x0:right?ex:ex-tw,x1:right?ex+tw:ex,y0:ey-th/2,y1:ey+th/2};
   let sc=R*.35;
   if(box.x0<V.x+2*k||box.x1>V.x+V.w-2*k||box.y0<V.y+(s.id==="head"?4:30)*k||box.y1>V.y+V.h-4*k)continue;
   for(const p of placed){if(hit(box,p.box))sc+=900;}
   let cov=0;for(const fx of [.05,.5,.95])for(const fy of [.2,.8])if(inBody(box.x0+(box.x1-box.x0)*fx,box.y0+(box.y1-box.y0)*fy))cov++;
   sc+=cov*14;
   if(Math.abs(dy)>.92)sc+=6;
   for(const p of placed){const d=Math.hypot(p.ex-ex,p.ey-ey)/k;if(d<26)sc+=40;}
   if(!best||sc<best.sc)best={sc,box,ex,ey,right};}
  if(!best){const right=r.ax<cxm;const ex=right?V.x+V.w-tw-6*k:V.x+6*k+tw;best={box:{x0:right?ex:ex-tw,x1:right?ex+tw:ex,y0:r.ay-th/2,y1:r.ay+th/2},ex,ey:r.ay,right};}
  placed.push({...best,r});});
 t.innerHTML=placed.filter(p=>p.r).map(({box,ex,ey,right,r})=>{const col=(P[r.role]||["","#E3E0BF"])[1];
  return `<line x1="${r.ax}" y1="${r.ay}" x2="${right?box.x0:box.x1}" y2="${ey}" stroke="#3E4A80" stroke-width="${.9*k}"/><circle cx="${r.ax}" cy="${r.ay}" r="${3*k}" fill="${col}" stroke="#3E4A80" stroke-width="${.8*k}"/><rect x="${box.x0}" y="${box.y0}" width="${box.x1-box.x0}" height="${th}" fill="${col}" stroke="#3E4A80" stroke-width="${.6*k}" stroke-opacity=".35"/><text x="${box.x0+fs*.65}" y="${ey+fs*.36}" font-family="JetBrains Mono,monospace" font-size="${fs}" letter-spacing="${.3*k}" fill="${tc(col)}">${esc(r.L.toUpperCase())}</text>`;}).join("");
 if(MG){const R=MG.R,mx=MG.x,my=MG.y;
  g.innerHTML=`<g class="mag" id="mag" role="button" tabindex="0" aria-label="Zoom into the brain"><circle cx="${mx}" cy="${my}" r="${R}" fill="#FFFFF4" stroke="#DB6830" stroke-width="${1.6*k}"/><circle cx="${mx-2*k}" cy="${my-2*k}" r="${6*k}" fill="none" stroke="#DB6830" stroke-width="${1.6*k}"/><path d="M${mx+2.5*k} ${my+2.5*k}l${5*k} ${5*k}" stroke="#DB6830" stroke-width="${2*k}" stroke-linecap="round"/></g>`;
  $("mag").onclick=()=>{st.view="head";render();};$("mag").onkeydown=e=>{if(e.key==="Enter"){st.view="head";render();}};}}
/* ---------- render ---------- */
function showSvg(){["fem","mal","head"].forEach(id=>$(id).toggleAttribute("hidden",id!==(st.view==="head"?"head":st.body)));
 $("b-fem").setAttribute("aria-pressed",st.body==="fem");$("b-mal").setAttribute("aria-pressed",st.body==="mal");$("z-back").hidden=st.view!=="head";}
function render(){showSvg();const s=svgOf(),list=litFor(),on=light(list);
 const tgt=st.view==="head"?VB0.head:frame(s,on);zoomTo(s,tgt);
 $("z-out").hidden=st.view==="head"||tgt===VB0[s.id];
 $("cap").textContent=(st.comp?st.comp.n:st.role?P[st.role][0]:st.sys!=null?SYS[st.sys][0]:"Tap a system, role or compound")+(st.view==="head"?" · brain":"");}
/* ---------- lists ---------- */
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function matches(c,q){if(!q)return true;const h=norm([c.n,c.al,c.f,...c.r.map(r=>P[r]&&P[r][0]),...c.x.map(r=>P[r]&&P[r][0]),...c.r.map(r=>SYS[sysOf[r]]&&SYS[sysOf[r]][0]),...Object.values(c.d||{}),...c.o.map(e=>e.at)].join(" "));return norm(q).split(/\s+/).filter(Boolean).every(w=>h.includes(w));}
function pool(){return C.filter(c=>(st.sys==null||c.r.some(r=>sysOf[r]===st.sys))&&(!st.role||c.r.includes(st.role)||c.x.includes(st.role))&&matches(c,st.q)).sort((a,b)=>((a.k||999)-(b.k||999))||a.n.localeCompare(b.n));}
function sysStrip(){$("sys").innerHTML=SYS.map(([n,rs],i)=>{const k=C.filter(c=>c.r.some(r=>sysOf[r]===i)).length;return `<button type="button" class="sys" data-i="${i}" aria-pressed="${st.sys===i}">${esc(n)}<i>${k}</i></button>`;}).join("");
 $("clr").hidden=st.sys==null&&!st.role&&!st.comp&&!st.q;}
function roleStrip(){const rs=st.sys==null?ROLES:SYS[st.sys][1].filter(r=>count[r]).sort((a,b)=>count[b]-count[a]);
 $("rlab").textContent=st.sys==null?`Roles · ${rs.length}`:`${SYS[st.sys][0]} · ${rs.length} roles`;
 $("roles").innerHTML=rs.map(r=>`<button type="button" class="rchip" data-r="${r}" aria-pressed="${st.role===r}" style="background:${P[r][1]};color:${tc(P[r][1])}">${esc(P[r][0])}<i>${count[r]}</i></button>`).join("");}
function compStrip(){const L=pool();$("qn").textContent=st.q?`${L.length} found`:"";$("qx").hidden=!st.q;
 $("clab").textContent=`${st.role?P[st.role][0]+" · ":st.sys!=null?SYS[st.sys][0]+" · ":""}${L.length} compounds, most popular first`;
 $("comps").innerHTML=L.length?L.map(c=>`<button type="button" class="cchip" data-s="${c.s}" aria-pressed="${st.comp===c}"><span class="sq" style="background:${(P[c.p]||P[c.r[0]]||["","#ccc"])[1]}"></span>${esc(c.n)}</button>`).join(""):`<span class="empty">Nothing matches. Try a feeling like sleep, skin or recovery.</span>`;
 $("comps").scrollLeft=0;sysStrip();}
/* ---------- card ---------- */
function stripe(c){const rs=c.r.filter(r=>P[r]);const n=rs.length;return rs.map((r,j)=>`<i style="flex:${n===1?1:j===0?70:30/(n-1)};background:${P[r][1]}"></i>`).join("");}
function card(){const c=st.comp,el=$("card");app.classList.toggle("carding",!!c);
 if(!c){el.innerHTML=isPhone()?"":`<div class="sec" style="padding:14px 12px"><h3>How to use</h3><p style="margin:0;font-size:13px">Pick a system or a role to see where it lives in the body, or pick a compound to see what it does there.</p></div>`;return;}
 const L=pool(),i=L.indexOf(c);
 const roleRows=c.r.filter(r=>P[r]).map(r=>`<li><span class="tag" style="background:${P[r][1]};color:${tc(P[r][1])}">${esc(P[r][0])}</span><span class="t">${esc(c.d[r]||"")}</span></li>`).join("")+
  c.x.filter(r=>P[r]).map(r=>`<li style="opacity:.75"><span class="tag" style="border:1px dashed ${P[r][1]};color:#3E4A80">${esc(P[r][0])}</span><span class="t">${esc(c.d[r]||"Reported")}</span></li>`).join("");
 const org=c.o.map((e,j)=>`<li data-j="${j}"><span class="sq" style="background:${(P[e.r]||["","#ccc"])[1]}"></span><span><b>${esc(e.at||NAME[e.k]||e.k)}</b> ${esc(e.note)}</span></li>`).join("");
 const who=w=>({rat:"rats",mouse:"mice",mice:"mice",human:"people",trial:"trial",cells:"cells",cell:"cells"})[String(w).toLowerCase()]||w;
 const d=c.ds;
 el.innerHTML=`<div class="stripe">${stripe(c)}</div>
 <div class="chd"><h2>${esc(c.n)} <span class="ap${/approved/i.test(c.ap)&&!/not|formerly/i.test(c.ap)?" ok":""}" title="${esc(c.st)}">${esc(c.ap)}</span></h2>
  <div class="cnav">${L.length>1&&i>=0?`<button type="button" id="cp" aria-label="Previous">‹</button><button type="button" id="cn" aria-label="Next">›</button>`:""}<button type="button" id="cx" aria-label="Close">×</button></div>
  ${c.f?`<p class="fn">For ${esc(c.f)}.</p>`:""}</div>
 <div class="sec"><h3>What it does</h3><ul class="roles">${roleRows}</ul></div>
 ${org?`<div class="sec"><h3>Where it works · tap one</h3><ul class="org">${org}</ul></div>`:""}
 ${c.m.length?`<div class="sec"><h3>How it works</h3><ol class="mech">${c.m.map(m=>`<li>${esc(m[0])}${m[1]?`<small>${esc(m[1])}</small>`:""}</li>`).join("")}</ol></div>`:""}
 ${c.t.length?`<div class="sec"><h3>What was tested, in whom</h3><ul class="tst">${c.t.map(t=>`<li>${esc(t[1])}<em>${esc(who(t[2]))}</em></li>`).join("")}</ul></div>`:""}
 ${d&&d.d?`<div class="sec"><h3>Common dose</h3><div class="dose"><div><span class="lab">Dose</span><b>${esc(d.d)}</b></div>${d.f?`<div><span class="lab">How often</span><b>${esc(d.f)}</b></div>`:""}${d.c?`<div><span class="lab">Cycle</span><b>${esc(d.c)}</b></div>`:""}${d.r?`<div><span class="lab">Route</span><b>${esc(d.r)}</b></div>`:""}</div></div>`:""}
 <a class="go" href="${BASE}/library/#/p/${c.s}">Full Library page →</a>
 <p class="fine">What people report and what studies show, not medical advice.</p>`;
 el.scrollTop=0;
 $("cx").onclick=()=>{st.comp=null;compStrip();card();setTimeout(render,30);};
 if($("cp")){$("cp").onclick=()=>openComp(L[(i-1+L.length)%L.length]);$("cn").onclick=()=>openComp(L[(i+1)%L.length]);}
 el.querySelectorAll(".org li").forEach(li=>li.onclick=()=>focusOrgan(c.o[+li.dataset.j]));}
function focusOrgan(e){if(!e)return;const head=HK.has(e.k)&&!!HEADONLY[e.k];if(head&&st.view!=="head"){st.view="head";render();}
 const s=svgOf(),k=st.view==="head"?e.k:(HEADONLY[e.k]||e.k);const els=[...s.querySelectorAll(`.film[data-k="${(ALIAS[k]||[k])[0]}"]`)];
 if(!els.length)return;if(st.view!=="head"){const tgt=frame(s,els);zoomTo(s,tgt,700);$("z-out").hidden=tgt===VB0[s.id];}
 els.forEach(x=>{x.classList.remove("ping");void x.getBBox();x.classList.add("ping");setTimeout(()=>x.classList.remove("ping"),2600);});}
function openComp(c){st.comp=c;st.view="body";$("comps").querySelectorAll(".cchip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.s===(c&&c.s)));card();sysStrip();
 requestAnimationFrame(()=>requestAnimationFrame(render));}
/* ---------- events ---------- */
$("sys").addEventListener("click",e=>{const b=e.target.closest(".sys");if(!b)return;const i=+b.dataset.i;st.sys=st.sys===i?null:i;st.role=null;st.comp=null;st.view="body";roleStrip();compStrip();card();render();});
$("roles").addEventListener("click",e=>{const b=e.target.closest(".rchip");if(!b)return;st.role=st.role===b.dataset.r?null:b.dataset.r;st.comp=null;st.view="body";roleStrip();compStrip();card();render();});
$("comps").addEventListener("click",e=>{const b=e.target.closest(".cchip");if(!b)return;const c=C.find(x=>x.s===b.dataset.s);openComp(st.comp===c?null:c);});
$("clr").onclick=()=>{st.sys=null;st.role=null;st.comp=null;st.q="";$("q").value="";st.view="body";roleStrip();compStrip();card();render();};
let qt;$("q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value.trim();compStrip();},120);});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){const L=pool();if(L.length)openComp(L[0]);$("q").blur();}});
$("qx").onclick=()=>{st.q="";$("q").value="";compStrip();};
$("b-fem").onclick=()=>{st.body="fem";st.view="body";render();};$("b-mal").onclick=()=>{st.body="mal";st.view="body";render();};
$("z-back").onclick=()=>{st.view="body";render();};
$("z-out").onclick=()=>{const s=svgOf();zoomTo(s,VB0[s.id]);$("z-out").hidden=true;};
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{const s=svgOf();const on=s.__on||[];const tgt=st.view==="head"?VB0.head:frame(s,on);s.setAttribute("viewBox",tgt.join(" "));drawTags(s);},150);});
(function hints(){const ex=["sleep","tendon pain","skin","appetite","focus","BPC-157","fat loss","libido"];let i=0;setInterval(()=>{if(document.activeElement!==$("q")&&!$("q").value){i=(i+1)%ex.length;$("q").placeholder="Search: "+ex[i];}},2600);})();
roleStrip();compStrip();card();
const deep=(location.hash.match(/#\/c\/([^/?]+)/)||[])[1];if(deep){const c=C.find(x=>x.s===deep);if(c)openComp(c);else render();}else render();
</script></body></html>
