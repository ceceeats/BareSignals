<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Step up · Bare Signals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
:root{--paper:#FFFFE2;--chip:#FFFFF4;--ink:#3E4A80;--soft:#6B76A8;--rule:#E3E0BF;--act:#5271FF;--dose:#2F6B46;--draw:#E8701F;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--head:"Bricolage Grotesque",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 var(--body)}
#bar{position:fixed;top:0;left:0;height:3px;background:var(--ink);width:0;z-index:9}
main{max-width:520px;margin:0 auto;padding:16px 14px 90px}
h1{font:700 24px/1.1 var(--head);margin:4px 0 2px}.sub{color:var(--soft);font-size:13px;margin:0 0 10px}
.sum{display:flex;flex-wrap:wrap;gap:4px 12px;font:600 12px var(--mono);border:1px solid var(--rule);background:var(--chip);padding:7px 9px;margin-bottom:8px}
.sum b{color:var(--soft);font-weight:500}
details{border:1px solid var(--rule);margin-bottom:10px;background:var(--chip)}summary{padding:7px 9px;font:600 13px var(--mono);color:var(--act);cursor:pointer;list-style:none}summary::after{content:" ▾"}
.set{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;padding:0 9px 9px}.set label{font:500 11px var(--mono);color:var(--soft);display:flex;flex-direction:column;gap:2px}.set .full{grid-column:1/-1}
input{font:600 16px var(--mono);color:var(--ink);background:#fff;border:1px solid var(--rule);padding:5px 6px;width:100%;border-radius:0}
.mo{font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:12px 0 3px;display:flex;justify-content:space-between}
.wk{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:6px;border-bottom:1px solid var(--rule);padding:7px 2px;cursor:pointer}
.wk .n{font:700 13px var(--mono);white-space:nowrap}.wk .d{font-size:13px}.wk .u{font:700 15px var(--mono);color:var(--draw);text-align:right;white-space:nowrap}
.wk .r{display:block;font:500 11px var(--mono);color:var(--dose);text-align:right}
.wk .tag{font:600 10px var(--mono);color:var(--act);margin-left:4px}
.wk.skip .u{color:var(--soft);text-decoration:line-through}.wk.past{opacity:.55}.wk.now{background:#FFFFF4;box-shadow:inset 3px 0 0 var(--ink)}
.ed{grid-column:1/-1;padding:6px 0 2px;display:none}.wk.open .ed{display:block}
.row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.c{font:600 13px var(--mono);border:1px solid #C9CEEC;background:#fff;color:var(--ink);padding:5px 8px;cursor:pointer}
.c.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.c.a{color:var(--act);border-color:var(--act)}
.step{display:flex;align-items:center;gap:6px;font:600 13px var(--mono)}.step input{width:70px;text-align:center}
.mode{font-size:12px;color:var(--soft);display:flex;gap:10px;margin:2px 0 6px}.mode label{display:flex;gap:4px;align-items:center}.mode input{width:auto}
.note{font-size:11px;color:var(--soft);margin-top:10px}
.foot{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--rule);padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.foot button{font:600 14px var(--mono);color:var(--act);border:1px solid var(--act);background:#fff;padding:8px 12px;flex:1;max-width:220px;cursor:pointer}
#toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font:600 12px var(--mono);padding:6px 10px;opacity:0;transition:.2s;pointer-events:none}
@media(min-width:760px){main{max-width:640px;padding-top:28px}h1{font-size:30px}.wk{grid-template-columns:70px 1fr auto;padding:9px 4px}.wk .u{font-size:17px}}
</style></head><body><div id="bar"></div><main>
<h1 id="t">Step up</h1><p class="sub">Tap any week to change it. Every week after it follows.</p>
<div class="sum" id="sum"></div>
<details><summary>Vial and plan settings</summary><div class="set">
<label>Name<input id="f_n"></label><label>Compound<input id="f_c"></label>
<label>Vial real mg<input id="f_mg" inputmode="decimal"></label><label>Water ml<input id="f_ml" inputmode="decimal"></label>
<label>First shot<input id="f_d" type="date"></label><label>Weeks per step<input id="f_h" inputmode="numeric"></label>
<label class="full">Step ladder in units (comma)<input id="f_l"></label><label>Weeks shown<input id="f_w" inputmode="numeric"></label>
</div></details>
<div id="list"></div>
<p class="note">U-100 syringe. Real dose uses the vial's tested mg. Reported community steps, not medical advice.</p>
</main>
<div class="foot"><button id="cp">Copy for WhatsApp</button><button id="ln">Copy link</button></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const S={n:'',c:'Retatrutide',mg:11.53,ml:3,d:new Date().toISOString().slice(0,10),l:[15,20,30],h:4,w:12,e:{}};
function readHash(){const p=new URLSearchParams(location.hash.slice(1));if(p.has('n'))S.n=p.get('n');if(p.has('c'))S.c=p.get('c');
 if(p.has('mg'))S.mg=+p.get('mg');if(p.has('ml'))S.ml=+p.get('ml');if(p.has('d'))S.d=p.get('d');if(p.has('l'))S.l=p.get('l').split('.').map(Number).filter(x=>x>0);
 if(p.has('h'))S.h=+p.get('h')||4;if(p.has('w'))S.w=+p.get('w')||12;S.e={};(p.get('e')||'').split('.').filter(Boolean).forEach(t=>{const[k,v]=t.split(':');
 S.e[+k]=v==='s'?{s:1}:{u:parseFloat(v),o:/o$/.test(v)?1:0}})}
function hash(){const e=Object.keys(S.e).sort((a,b)=>a-b).map(k=>k+':'+(S.e[k].s?'s':S.e[k].u+(S.e[k].o?'o':''))).join('.');
 const p=new URLSearchParams({n:S.n,c:S.c,mg:S.mg,ml:S.ml,d:S.d,l:S.l.join('.'),h:S.h,w:S.w});if(e)p.set('e',e);return p.toString()}
const conc=()=>S.mg/S.ml, real=u=>u/100*conc(), f2=x=>(Math.round(x*100)/100).toString();
const day=i=>{const t=new Date(S.d+'T12:00:00');t.setDate(t.getDate()+7*i);return t};
const fmt=t=>t.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
function plan(){const out=[];let cur=S.l[0]||10,held=0;
 for(let i=0;i<S.w;i++){const e=S.e[i];
  if(e&&e.s){out.push({i,skip:1,u:0,tag:'skip'});continue}
  if(e&&!e.o){cur=e.u;held=0}else if(held>=S.h){const nx=S.l.find(x=>x>cur);if(nx!==undefined)cur=nx;held=0}
  held++;const u=e&&e.o?e.u:cur;out.push({i,u,base:cur,tag:e?(e.o?'this week only':'changed'):''})}
 let used=0,vial=1;out.forEach(r=>{used+=real(r.u);if(used>S.mg*vial+1e-9){vial++;r.nv=1}});return{out,used}}
let open=-1;
function render(){const{out,used}=plan();$('t').textContent=(S.n?S.n+' · ':'')+S.c;
 $('sum').innerHTML=`<span><b>Vial</b> ${S.mg} mg in ${S.ml} ml</span><span><b>1 U</b> = ${f2(conc()/100*1000)} mcg</span><span><b>Total</b> ${f2(used)} mg</span><span><b>Left</b> ${f2(Math.max(0,Math.ceil(used/S.mg)*S.mg-used))} mg</span>`;
 const today=new Date();today.setHours(0,0,0,0);let h='',last=null;
 out.forEach(r=>{const g=r.skip?last:r.base;if(!r.skip&&g!==last){h+=`<div class="mo"><span>${g} U steps</span><span>${f2(real(g))} mg</span></div>`;last=g}
  const t=day(r.i),dd=new Date(t);dd.setHours(0,0,0,0);const diff=(today-dd)/864e5,cls=diff>=7?' past':(diff>=0&&diff<7?' now':'');
  h+=`<div class="wk${r.skip?' skip':''}${cls}${open===r.i?' open':''}" data-i="${r.i}"><span class="n">Week ${r.i+1}</span><span class="d">${fmt(t)}${r.tag?`<span class="tag">${r.tag}</span>`:''}${r.nv?'<span class="tag">new vial</span>':''}</span>
  <span class="u">${r.skip?'skip':r.u+' U'}<span class="r">${r.skip?'none':'real dose '+f2(real(r.u))+' mg'}</span></span>${open===r.i?editor(r):''}</div>`});
 $('list').innerHTML=h;history.replaceState(null,'','#'+hash())}
function editor(r){const e=S.e[r.i]||{},once=e.o||e.s;const u=r.skip?r.base||S.l[0]:r.u;
 return `<div class="ed"><div class="mode"><label><input type="radio" name="m" value="f" ${once?'':'checked'}>From here on</label><label><input type="radio" name="m" value="o" ${once?'checked':''}>Just this week</label></div>
 <div class="row">${S.l.map(x=>`<button class="c${x===u&&!r.skip?' on':''}" data-u="${x}">${x} U</button>`).join('')}<button class="c" data-dbl="1">Double</button><button class="c${r.skip?' on':''}" data-s="1">Skip</button></div>
 <div class="row"><span class="step"><button class="c" data-st="-1">−</button><input id="cu" inputmode="decimal" value="${u}"> U <button class="c" data-st="1">+</button></span><button class="c a" data-ok="1">Set</button>${S.e[r.i]?'<button class="c a" data-rs="1">Back to plan</button>':''}</div></div>`}
function setEdit(i,v){const once=document.querySelector('input[name=m]:checked')?.value==='o';
 Object.keys(S.e).forEach(k=>{const x=S.e[k];if(+k>i&&!once&&!x.o&&!x.s)delete S.e[k]});
 S.e[i]=v==='s'?{s:1}:{u:+v,o:once?1:0};open=-1;render()}
$('list').addEventListener('click',ev=>{const b=ev.target.closest('button'),w=ev.target.closest('.wk');if(!w)return;const i=+w.dataset.i;
 if(!b){if(ev.target.closest('.ed'))return;open=open===i?-1:i;render();return}
 const r=plan().out[i];
 if(b.dataset.u)setEdit(i,b.dataset.u);else if(b.dataset.s){document.querySelector('input[name=m][value=o]').checked=true;setEdit(i,'s')}
 else if(b.dataset.dbl){document.querySelector('input[name=m][value=o]').checked=true;setEdit(i,(r.base||r.u)*2)}
 else if(b.dataset.st){const c=$('cu');c.value=Math.max(0.5,(+c.value||0)+(+b.dataset.st))}
 else if(b.dataset.ok){const v=parseFloat($('cu').value);if(v>0)setEdit(i,v)}
 else if(b.dataset.rs){delete S.e[i];open=-1;render()}});
const F={n:'n',c:'c',mg:'mg',ml:'ml',d:'d',h:'h',w:'w'};
function fill(){for(const k in F)$('f_'+k).value=S[k];$('f_l').value=S.l.join(', ')}
Object.keys(F).forEach(k=>$('f_'+k).addEventListener('change',e=>{const v=e.target.value;S[k]=['mg','ml','h','w'].includes(k)?(+v||S[k]):v;if(k==='w')S.w=Math.min(52,Math.max(1,S.w));render()}));
$('f_l').addEventListener('change',e=>{const l=e.target.value.split(/[ ,]+/).map(Number).filter(x=>x>0).sort((a,b)=>a-b);if(l.length){S.l=l;render()}});
function toast(t){const x=$('toast');x.textContent=t;x.style.opacity=1;setTimeout(()=>x.style.opacity=0,1600)}
function copy(t,m){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(m)).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast(m)})}
$('cp').onclick=()=>{const{out}=plan();let t=`${S.n?S.n+' · ':''}${S.c} ${S.mg}mg in ${S.ml}ml (U-100)\n`;
 out.forEach(r=>{t+=`\nWeek ${r.i+1} · ${fmt(day(r.i))} · `+(r.skip?'skip':`${r.u} units (real dose ${f2(real(r.u))}mg)`)});copy(t,'Copied')};
$('ln').onclick=()=>copy(location.href,'Link copied');
addEventListener('scroll',()=>{const h=document.documentElement;$('bar').style.width=(h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100)+'%'});
addEventListener('hashchange',()=>{if(location.hash.slice(1)!==hash()){readHash();fill();render()}});
readHash();fill();render();
</script></body></html>
