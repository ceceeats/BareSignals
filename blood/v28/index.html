/* Blood Work v26 (25 Oct 2026), fix: picking from the full peptide grid on My plan no longer collapses the grid to "+ Add more peptides" after the first tap (it stays open until Done adding), and the page holds still when a pick or remove adds or drops a row of chips above it, so the next tap lands where you aim. Earlier the grid vanished under the finger and the next tap hit whatever slid up. Same version, v25 kept. peach action tint removed page wide (search box, buttons, suggestions, to do box now sit on cream, orange only as text and outline); plan picks lose the orange x, now a plain ink x, so picked peptides no longer read as flagged. v25 kept at /blood/v25/. Blood Work v25 (25 Oct 2026): My plan picks look like the Supplements Goes with boxes: cream box, ink outline, the peptide's own colour square, name in ink; only the remove x stays orange so it still reads as a button. v24 kept at /blood/v24/. Blood Work v24 (25 Oct 2026): stripes power first (power role widest on the left, then smaller in the sticker ratio 49 : 25 : 15 : 11, colours unchanged). v23 kept at /blood/v23/. Blood Work v23 (25 Oct 2026): Add to plan sits at the bottom right of every card, after the Library and Dosage links; search ranks names first via /search.js (starts with, then a word in the name, then aliases; labels and notes from 3 letters), one letter shows only names starting with it. v22 kept at /blood/v22/. Blood Work v22 (24 Oct 2026): one content width with the site bar (nav v11): .wrap uses the shared 1240px box with 24px side padding on laptop (16px on phone), title meets the wordmark, right edge meets the A buttons; sticky search band no longer pokes 4px past the box. v21 kept at /blood/v21/. */
/* role tag: role name inside its colour block, same as Library and Home */
.rtg{display:inline-block;font:500 10px/1.15 "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.05em;text-transform:uppercase;padding:4px 6px;border:1.5px solid #3E4A80;white-space:nowrap;font-style:normal;vertical-align:middle}
.rtg.s{font-size:8.5px;padding:2px 4px;border-width:1px}
.kr{grid-template-columns:minmax(0,1fr)!important}
.kr>.rtg{justify-self:start;white-space:normal}
.kr span{grid-column:1!important}

/* Blood Work v12 (23 Oct 2026): phone fix, the "reported" tag on label rows no longer runs into the card border; label names wrap on narrow phones. v11 kept. Blood Work v11: testing protocols researched for the 18 compounds that only had Matrix marker effects (5-Amino-1MQ, SS-31, KPV and 15 more), action colour rule (orange tint = something you do or customize: My plan tab, Add to my plan, plan search and picks, checklist, copy link, Save as PDF, book a morning draw; red stays danger only; navigation stays ink) and a designed print/PDF document for My plan (white A4, ruled tables, checklist, built separately from the screen view). v10: symbol key moved to the top of each section as a labelled "Key" box (it read like part of the list), "The one thing to remember" reminders removed, personal and place notes removed from test text (data), VO2 Max note shortened. v9: compact compound cards. Each card opens as a short list (Before you start, While on it) of plain test names with a small dot for danger or watch; "Show full card" expands the full card (every Library label with what it does, the blood markers it touches, test details as compact rows, how often, red flags, test prep, markers, sources). Action buttons are orange: orange tint = something you do. Add to my plan sits on the left, Full entry in the Library and Reported dosage on the right. Bigger text. Test prep added everywhere: general rules on Blood tests, a "Before the test" section on every explainer (fasting corrected for 24 tests, biotin and other stops, timing), compound prep on cards, and a "Before your draw" checklist in My plan. v8: research numbers on marker rows ("Trials: ..." with who it was measured in, plus "research disagrees" and "no trial data" tags), TB-500 is now frag 17-23 with its research attached, full Thymosin Beta-4 researched, VO2 Max general ranges, supplement links rematched to Supplements v6. v7: phone-first compound cards. Tests are a chip grid with one symbol set (arrows, three red dots for danger, cost tier), marker effects collapse behind an expand with aim and high/low numbers on the right, every compound, test and supplement carries a colour from the 30-colour legend, "same as" protocols are written out in full, 46 researched compounds added with sources and confidence (90 in total). Built on v6 (the other session's dosage links kept). Earlier versions kept at /blood/v1/ to /blood/v6/. */
:root{--paper:#FFFFE2;--ink:#3E4A80;--ink-soft:#6B76A8;--rule:#E3E0BF;--chip:#FFFFF4;--accent:#DB6830;--flag:#C02626;
 --display:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
a{color:inherit}
.wrap{max-width:var(--bs-w,1240px);margin:0 auto;padding:18px max(var(--bs-pad,16px),env(safe-area-inset-right,0px)) 44px max(var(--bs-pad,16px),env(safe-area-inset-left,0px))}
.lab{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0}
h1{font:700 26px/1.05 var(--display);margin:2px 0 6px}
h1 small{font:500 12px var(--mono);color:var(--accent);margin-left:6px;letter-spacing:.06em}
.lede{margin:0 0 10px;font-size:14px;color:var(--ink-soft);max-width:68ch}
.caution{border:1.5px solid var(--ink);background:var(--chip);box-shadow:3px 3px 0 var(--rule);padding:9px 12px;margin:0 0 14px;font-size:13px;line-height:1.4}
.caution b{font:700 12px var(--display)}
/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1.5px solid var(--ink);background:var(--chip);margin:0 0 10px;scroll-margin-top:8px}
.tabs button{font:600 12.5px/1.15 var(--body);color:var(--ink);background:transparent;border:0;border-right:1.5px solid var(--ink);padding:9px 3px;cursor:pointer;min-width:0}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs button b{font:600 10px var(--mono);margin-left:3px;color:var(--accent)}
.tabs button[aria-pressed="true"] b{color:#FFDE59}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.qw{position:relative;flex:1 1 240px}
.qw input{width:100%;font:500 14px var(--body);color:var(--ink);background:var(--chip);border:1.5px solid var(--ink);padding:8px 72px 8px 10px;border-radius:0}
#count{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;pointer-events:none}
.sub{margin:0 0 8px;font-size:13px;color:var(--ink-soft)}
.subh{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:18px 0 8px;padding-bottom:3px;border-bottom:1.5px solid var(--rule);grid-column:1/-1}
/* tags and chips */
.tg{display:inline-flex;align-items:center;gap:5px;font:600 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);border:1.2px solid var(--rule);background:var(--paper);padding:2px 6px 2px 3px}
.tg i,.cpl i,.sug i{display:block;width:11px;height:11px;flex:none;box-shadow:inset 0 0 0 1px rgba(62,74,128,.3)}
.tc{font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--rule);box-shadow:inset 4px 0 0 var(--c);padding:0 5px 0 9px;text-decoration:none;white-space:nowrap;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tc.grp{border-style:dashed}
.tc:hover{background:var(--ink);color:var(--paper)}
.cl{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.band{height:6px}
/* compound cards */
.card{border:1.5px solid var(--ink);background:var(--chip);box-shadow:2px 2px 0 var(--rule);margin-bottom:10px;scroll-margin-top:8px}
.card>h2{font:700 18px/1.1 var(--display);margin:0;padding:10px 12px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec{border-top:1.5px solid var(--rule);padding:8px 12px}
.sec h3{font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px;color:var(--ink-soft)}
.sec.b h3{color:var(--ink)}.sec.m h3{color:var(--accent)}.sec.f h3{color:var(--flag)}
.sec p{margin:0 0 4px;font-size:13.5px;line-height:1.6}
.sec p:last-child{margin-bottom:0}
.sec.freq{display:flex;gap:8px;align-items:baseline}
.sec.freq h3{margin:0;flex:none}.sec.freq p{font-weight:600;line-height:1.4}
.sec.f{background:#FFF4F2}
.sec.np p{font-size:13px;color:var(--ink-soft);font-style:italic}
.mxl{display:grid;gap:4px}
.mr{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--rule);box-shadow:inset 4px 0 0 var(--c);padding:6px 8px 6px 10px}
a.mr:hover{border-color:var(--ink)}
.mr .sy,.crow .sy{font:700 15px/1.2 var(--body);text-align:center}
.mr b{display:block;font:600 13px/1.25 var(--body)}
.mr span span{display:block;font-size:12.5px;line-height:1.3;color:var(--ink-soft)}
.mr.dg,.crow.dg{background:#FFF4F2}
.mr.dg .sy,.mr.dg b,.crow.dg .sy{color:var(--flag)}
.mr.home{box-shadow:inset 4px 0 0 var(--rule)}
.mr.home b::after{content:"  track at home";font:500 8.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.leg{margin:6px 0 0!important;font:500 9.5px/1.5 var(--mono)!important;letter-spacing:.04em;color:var(--ink-soft)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bt{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);letter-spacing:.04em;text-decoration:none;color:var(--ink);border:1.5px solid var(--ink);background:var(--paper);padding:6px 10px;cursor:pointer}
@media (hover:hover){.bt:hover{background:var(--ink);color:var(--paper)}}
.bt.on{background:var(--ink);color:var(--paper)}
.off{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.card.flash{animation:fl 1.8s ease}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--accent),2px 2px 0 var(--rule)}100%{box-shadow:2px 2px 0 var(--rule)}}
/* test rows */
.gcat{display:flex;align-items:center;gap:7px;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:16px 0 6px;padding-bottom:3px;border-bottom:1.5px solid var(--rule)}
.gcat i{display:block;width:11px;height:11px;flex:none;box-shadow:inset 0 0 0 1px rgba(62,74,128,.3)}
.tr{display:flex;justify-content:space-between;gap:8px;align-items:center;font:700 15px/1.2 var(--display);color:var(--ink);text-decoration:none;background:var(--chip);border:1.5px solid var(--ink);border-left:7px solid var(--c);box-shadow:2px 2px 0 var(--rule);padding:9px 12px;margin-bottom:8px}
.tr:hover{box-shadow:2px 2px 0 var(--accent)}
.tr .rg{font:500 11px var(--mono);color:var(--ink-soft);text-align:right;max-width:48%}
/* colour key */
.key{margin-top:22px;border:1.5px solid var(--ink);background:var(--chip);box-shadow:2px 2px 0 var(--rule)}
.key>p{margin:0;padding:8px 12px;border-bottom:1.5px solid var(--rule)}
.kg{display:grid;grid-template-columns:1fr}
.kr{display:grid;grid-template-columns:14px 1fr;gap:2px 9px;padding:8px 12px;border-bottom:1px dotted var(--rule);align-items:start}
.kr i{display:block;width:14px;height:14px;margin-top:1px;box-shadow:inset 0 0 0 1px rgba(62,74,128,.3)}
.kr b{font:700 13px/1.2 var(--display)}
.kr span{grid-column:2;font:500 9.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
/* explainer sheet */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.shbg{position:absolute;inset:0;background:rgba(62,74,128,.38)}
.shp{position:relative;width:100%;max-width:calc(700px / var(--z,1));max-height:calc(92vh / var(--z,1));max-height:calc(92dvh / var(--z,1));overflow:auto;overscroll-behavior:contain;background:var(--paper);border:1.5px solid var(--ink);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.shh{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.shh .in{display:flex;align-items:flex-start;gap:8px;padding:9px 12px 10px}
.shh h2{font:700 calc(21px*var(--hk,1))/1.1 var(--display);margin:3px 0 0}
.x{flex:none;font:600 11px var(--mono);letter-spacing:.04em;border:1.5px solid var(--ink);background:var(--chip);color:var(--ink);padding:6px 9px;cursor:pointer}
.x:hover{background:var(--ink);color:var(--paper)}
.facts{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.5px solid var(--rule);background:var(--chip)}
.facts div{padding:8px 12px;border-right:1.5px solid var(--rule);font-size:13px;line-height:1.35;font-weight:600}
.facts div:last-child{border-right:0}
.facts small,.two h4{display:block;font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 3px}
.ss{padding:11px 12px;border-bottom:1.5px solid var(--rule)}
.ss>h3{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.ss p{margin:0 0 7px;font-size:14px;line-height:1.6}
.ss p:last-child{margin-bottom:0}
.two{display:grid;grid-template-columns:1fr;gap:8px}
.two>div{border:1px solid var(--rule);background:var(--chip);padding:8px 10px}
.two p{font-size:13.5px}
.rt{border-top:1px solid var(--rule)}
.rr{display:grid;grid-template-columns:minmax(92px,36%) minmax(0,1fr);border:1px solid var(--rule);border-top:0;background:var(--chip)}
.rr b{font:600 10px/1.35 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:7px 8px;border-right:1px solid var(--rule);box-shadow:inset 4px 0 0 var(--rule)}
.rr span{padding:7px 9px;font-size:13.5px;line-height:1.4}
.rr.g b{box-shadow:inset 4px 0 0 #AACC96}
.rr.w b{box-shadow:inset 4px 0 0 #FF5050;color:var(--flag)}
.callout{border:1.5px solid var(--accent);background:#FFF6E6;padding:8px 10px;margin-top:9px}
.callout h4{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.callout p{font-size:13.5px}
.cls{display:flex;flex-wrap:wrap;gap:6px}
.cpl{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--body);text-decoration:none;color:var(--ink);border:1.2px solid var(--ink);background:var(--chip);padding:4px 9px 4px 6px}
.cpl:hover{background:var(--ink);color:var(--paper)}
.crl{display:grid;gap:3px}
.crow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;align-items:start;text-decoration:none;color:var(--ink);padding:5px 6px;border-bottom:1px dotted var(--rule);font-size:13.5px;line-height:1.35}
.crow:hover{background:var(--chip)}
.crow b{font-weight:600}
.crow em{font-style:normal;color:var(--ink-soft)}
.crow .q{display:block;font-size:12.5px;line-height:1.4;color:var(--ink-soft);font-style:italic;margin-top:2px}
.rem{background:var(--ink);color:var(--paper);padding:11px 12px;margin:12px;border:1.5px solid var(--ink)}
.rem h3{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#FFDE59;margin:0 0 5px}
.rem p{margin:0 0 6px;font-size:14px;line-height:1.55}
.rem .tc{color:var(--ink)}
.shl{padding:10px 12px}
/* plan */
.psel{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.pc{display:inline-flex;align-items:center;gap:7px;font:600 13px var(--body);color:var(--paper);background:var(--ink);border:1.5px solid var(--ink);padding:5px 6px 5px 10px;cursor:pointer}
.pc span{font:600 11px var(--mono);border-left:1px solid rgba(255,255,226,.4);padding-left:6px}

.sug .subh{margin:12px 0 6px}
.sug button{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--body);color:var(--ink);background:var(--chip);border:1.2px solid var(--rule);padding:5px 9px 5px 6px;cursor:pointer}
.sug button:hover{border-color:var(--ink)}
.sug button em{font:500 9px var(--mono);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.pempty{border:1.5px dashed var(--ink-soft);padding:14px;margin-top:12px;font-size:14px;color:var(--ink-soft);background:var(--chip)}
.pstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--ink);background:var(--chip);margin:14px 0 10px}
.pstat div{padding:9px 10px;border-right:1.5px solid var(--ink)}
.pstat div:last-child{border-right:0}
.pstat b{display:block;font:700 26px/1 var(--display)}
.pstat span{font:500 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.pbox{border:1.5px solid var(--ink);background:var(--chip);box-shadow:2px 2px 0 var(--rule);margin:0 0 12px}
.pbox>.bh{padding:9px 12px 8px;border-bottom:1.5px solid var(--ink)}
.pbox>.bh h3{font:700 16px/1.15 var(--display);margin:0}
.pbox>.bh p{margin:3px 0 0;font-size:12.5px;color:var(--ink-soft)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:baseline;padding:8px 12px 9px;border-bottom:1px dotted var(--rule);border-left:6px solid var(--c);text-decoration:none;color:var(--ink)}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--paper)}
.prow b{font:700 14.5px/1.2 var(--display)}
.prow .tgt{grid-column:1/-1;font:500 11.5px/1.35 var(--mono);color:var(--ink)}

.why span.dg{color:var(--flag);border-color:var(--flag)}
.fastb{font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1.2px solid var(--accent);color:var(--accent);padding:1px 5px}

.pl:last-child{border-bottom:0}
.pl>b{display:block;font:700 13.5px var(--display);margin-bottom:2px}
.pl p{margin:0 0 4px;font-size:13.5px;line-height:1.55}
.pl .crow{border:0;padding:2px 0}

#plink{flex:1 1 220px;font:500 11px var(--mono);color:var(--ink);background:var(--chip);border:1.5px solid var(--rule);padding:6px 8px}
.foot{margin-top:18px;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}

@media (min-width:760px){.sheet{align-items:center;padding:24px}.shp{max-height:88vh;border-bottom:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--rule)}}

 #list.pep{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;align-items:start}
 #list.gls{column-count:2;column-gap:12px}
 #list.gls .tr,#list.gls .gcat{break-inside:avoid}
 .kg{grid-template-columns:repeat(3,minmax(0,1fr))}

 .bsn,.tabs,.ctl,.key,.caution,.acts,.qw,.sug,.psel,.pacts,.sheet,.lede{display:none!important}
 body{background:#fff}.wrap{padding:0}.pbox,.pstat{box-shadow:none;break-inside:avoid}.prow{break-inside:avoid}
}
/* v7: phone-first sizes, test chip grid with symbols, collapsible marker numbers, colour tags everywhere */
body{font-size:16px}
.lede{font-size:15px}.caution{font-size:14px}
.tabs button{font-size:13.5px;padding:10px 3px}
.card>h2{font-size:22px;padding:10px 12px 4px}

.band{display:flex;height:7px}.band i{display:block}

.sec h3{font-size:10px;margin-bottom:7px}

/* symbols */
.ic{display:inline-flex;align-items:center;justify-content:center;font:800 14px/1 var(--body);color:var(--ink);min-width:12px}

.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font:500 11px/1.3 var(--mono);color:var(--ink-soft);margin:2px 0 10px}

/* test chip grid */
.tks{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:6px}
.tk{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--rule);box-shadow:inset 5px 0 0 var(--c);padding:7px 8px 7px 12px;min-height:44px;justify-content:center}

/* markers, collapsed by default */
.mxd summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.mxd summary::-webkit-details-marker,.nf summary::-webkit-details-marker,.srcd summary::-webkit-details-marker{display:none}
.mxd summary .ms{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--ink);padding:4px 8px;background:var(--paper)}
.mxd summary .ms b{font:700 12px var(--mono)}
.mxd summary .ms::after{content:"▾";font-size:12px}
.mxd[open] summary .ms::after{content:"▴"}
.mxd[open] summary{margin-bottom:10px}
.mxl{display:grid;gap:5px}
.mr2{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--rule);box-shadow:inset 4px 0 0 var(--c);padding:7px 9px 7px 10px}
a.mr2:hover{border-color:var(--ink)}
.mr2 .mi{display:flex;justify-content:center}
.mr2 .mt b{display:block;font:600 14px/1.25 var(--body)}
.mr2 .mt span{display:block;font-size:12.5px;line-height:1.3;color:var(--ink-soft)}
.mr2 .nm{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;max-width:44vw}
.mr2 .nm span{font:600 11.5px/1.2 var(--mono);white-space:nowrap}
.mr2 .nm small{font:500 8.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-right:4px;color:var(--ink-soft)}
.mr2 .nm .aim{color:var(--ink)}
.mr2 .nm .bad{color:var(--flag)}
.mr2 .nm .bad small{color:var(--flag)}
.mr2 .nm.hm{font:500 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.mr2.dg{background:#FFF4F2;border-color:#F5B5B5}
.mr2.dg .mt b{color:var(--flag)}
.mr2.home{box-shadow:inset 4px 0 0 var(--rule)}
.nf summary,.srcd summary{list-style:none;cursor:pointer;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.nf summary::after,.srcd summary::after{content:" ▾"}
.nf[open] summary::after,.srcd[open] summary::after{content:" ▴"}
.nf h3{margin-top:10px}

.srcd em{color:var(--ink-soft);font-style:normal}
.rmeta p{font-size:14px;color:var(--ink);margin-top:7px}
.rb{display:inline-block;font:600 9.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border:1.2px solid var(--ink);box-shadow:inset 4px 0 0 var(--rule)}
.rb.c-verified{box-shadow:inset 4px 0 0 #AACC96}.rb.c-reported{box-shadow:inset 4px 0 0 #99ACFF}.rb.c-inferred{box-shadow:inset 4px 0 0 #FFA51F}.rb.c-speculated{box-shadow:inset 4px 0 0 #FF5050}
.refn{font-style:italic;color:var(--ink-soft)!important}
/* colour chips for compounds and supplements */
.cl{color:var(--ink);font-weight:600;text-decoration:none;background:var(--paper);border:1px solid var(--rule);box-shadow:inset 3px 0 0 var(--c);padding:0 5px 0 8px;white-space:nowrap}
.cl:hover{background:var(--ink);color:var(--paper)}
.cpl,.spc{display:inline-flex;align-items:center;gap:6px;font:600 13.5px var(--body);text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--paper);box-shadow:inset 4px 0 0 var(--c);padding:5px 9px 5px 11px}
.cpl:hover,.spc:hover{border-color:var(--ink)}
.crow{box-shadow:inset 3px 0 0 var(--c);padding-left:9px}
.sug button{box-shadow:inset 4px 0 0 var(--c);padding-left:11px}
.why span{box-shadow:inset 3px 0 0 var(--c);padding-left:7px}
.facts.f3{grid-template-columns:1fr 1fr}
.facts.f3 div:last-child{grid-column:1/-1;border-top:1.5px solid var(--rule)}
.pstat{grid-template-columns:repeat(4,minmax(0,1fr))}
.pstat b{font-size:24px}
.tr .tierb{margin-left:4px}
@media (min-width:640px){.facts.f3{grid-template-columns:repeat(3,1fr)}.facts.f3 div:last-child{grid-column:auto;border-top:0}}
@media (max-width:420px){.mr2{grid-template-columns:26px minmax(0,1fr) auto;gap:6px}.mr2 .nm span{font-size:11px}.tks{grid-template-columns:1fr 1fr}.pstat b{font-size:20px}.pstat span{font-size:8.5px}}
.mr2 .mt .mg{display:block;margin-top:3px;font-size:12px;line-height:1.35;color:var(--ink)}
.mr2 .mt .mg b{font:700 12px var(--mono)}
.mr2 .mt .mgl{font:600 8.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-right:5px}
.mr2 .mt i.rd{font:700 8.5px var(--mono);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--flag);border:1.2px solid var(--flag);padding:0 4px;white-space:nowrap}
.mr2 .mt i.nt{font:500 8.5px var(--mono);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);border:1px dashed var(--rule);padding:0 4px}

/* v9: compact cards, orange actions, prep */
:root{--act:#DB6830;--actbg:#FFFFF4;--actbd:#F2B48F}
.card>h2{font-size:23px;padding:11px 12px 6px}
.tags{padding:0 12px 10px}
.tags .tg{font-size:10.5px;padding:3px 8px 3px 4px}
.tags .tg i{width:12px;height:12px}
.cq{border-top:1.5px solid var(--rule);padding:10px 12px}

.cq+.cq{padding-top:8px}
.tpl{display:flex;flex-wrap:wrap;gap:5px}
.h3b{margin-top:12px!important}
.ta.tm2 div{display:grid;grid-template-columns:12px 8.6em minmax(0,1fr);gap:8px;font-size:14px}.ta.tm2 b{white-space:normal}
.chk h4{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:6px 0 0;list-style:none}
.tp{display:inline-flex;align-items:center;gap:5px;font:600 14.5px/1.2 var(--body);text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--paper);box-shadow:inset 4px 0 0 var(--c);padding:5px 8px 5px 10px}
.tp:hover{border-color:var(--ink)}
.tp.dg{background:#FFF4F2;border-color:#F5B5B5}
.pd{display:inline-block;width:6px;height:6px;border-radius:50%;flex:none;background:var(--flag)}
.pd.w{background:#FFA51F}
.cq .more{font:500 11px var(--mono);color:var(--ink-soft);margin:7px 0 0}
.xp{border-top:1.5px solid var(--rule)}
.xp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.xp>summary::-webkit-details-marker{display:none}
.xp>summary::after{content:'▾';font-size:13px;transition:transform .15s}
.xp[open]>summary::after{transform:rotate(180deg)}
.xp[open]>summary{background:var(--paper)}
.xp>summary .hint{font-weight:500;color:var(--ink-soft);text-transform:none;letter-spacing:0;font-family:var(--body);font-size:12.5px}
.ta{display:flex;flex-direction:column;gap:5px}
.ta div{display:flex;gap:8px;align-items:baseline;font-size:15px;line-height:1.4}
.ta i{display:block;width:12px;height:12px;flex:none;transform:translateY(1px);box-shadow:inset 0 0 0 1px rgba(62,74,128,.3)}
.ta b{font-weight:600;white-space:nowrap}
.ta span{color:var(--ink-soft)}
.ta span{flex:1 1 auto;min-width:0}
.ta b{white-space:normal}

.tch{margin-top:8px;font-size:14px;line-height:1.5;color:var(--ink-soft)}

.trw{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-decoration:none;color:var(--ink);box-shadow:inset 4px 0 0 var(--c);padding:7px 10px 7px 12px;border-top:1px solid var(--rule)}

.trw b{font:600 15px/1.25 var(--body);display:flex;align-items:center;gap:6px}

.fixn{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px}
/* actions: orange = something you do */
.acts2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:8px;border-top:1.5px solid var(--rule);padding:10px 12px}

    return [...by.values()].map(x=>`<span class="${x.s.has('⚡')?'dg':''}" style="--c:${ccol(x.c)}">${esc(x.c.name)}${x.s.size?' '+[...x.s].sort((a,b)=>SYO[a]-SYO[b]).map(ico).join(''):''}</span>`).join('')};
  const prow=e=>{const t=e.t,g=target(t);return `<a class="prow" href="#/t/${t.id}" style="--c:${tcol(t.id)}"><b>${esc(t.n)}</b><span>${isFast(t)?'<span class="fastb">Fast</span>':''}${tierB(t)}</span>${g?`<span class="tgt">${esc(g)}</span>`:''}<span class="why">${why(e)}</span></a>`};
  const homeBy=new Map();home.forEach(x=>{const a=homeBy.get(x.m)||[];a.push(x);homeBy.set(x.m,a)});
  LAST={must,watch,homeBy,nf,nd,nr};
  out.innerHTML=(must.length?`<div class="pstat"><div><b>${must.length}</b><span>tests to run</span></div><div><b>${nf}</b><span>say fast first</span></div><div><b>${nd}</b><span>danger markers</span></div><div><b>${nr}</b><span>pricier, few labs</span></div></div>`:`<div class="nodraw"><b>No blood draw needed</b>${homeBy.size?'Nothing in this pick needs a lab test. Track the items under “Track at home” yourself.':'Nothing in this pick needs a lab test.'}</div>`)+`
  ${nf?`<div class="actnote"><span class="an">To do</span><div><b>Book a morning draw.</b> ${nf} of these tests say to fast first, most for 8 to 12 hours. Tap a test to check its own note.</div></div>`:''}
  <div class="pacts"><button type="button" class="bt" data-copy>Copy link to this plan</button><button type="button" class="bt" data-print>Save as PDF</button><input id="plink" readonly hidden aria-label="Plan link"></div>
    ${LEGEND}
  <div class="pgrid"><div>
  ${must.length?'':'<!--'}<div class="pbox"><div class="bh"><h3>Test these</h3><p>Before you start and while you are on it. Tap any test to see what it means.</p></div>${must.map(prow).join('')||'<div class="pl"><p>No lab tests listed for this pick.</p></div>'}</div>${must.length?'':'-->'}
  ${must.length?drawList(must):''}
  ${watch.length?`<div class="pbox"><div class="bh"><h3>Also moved by your stack</h3><p>Not on the protocol, but these shift. Worth a look on the same draw.</p></div>${watch.map(prow).join('')}</div>`:''}
  </div><div>
  ${homeBy.size?`<div class="pbox"><div class="bh"><h3>Track at home</h3><p>Not lab tests. Watch these yourself.</p></div>${[...homeBy].map(([m,a])=>`<div class="pl"><b>${esc(m)}</b>${crows(a)}</div>`).join('')}</div>`:''}
  <div class="pbox"><div class="bh"><h3>How often</h3></div>${PLAN.map(id=>{const c=CI[id];return `<div class="pl"><b>${esc(c.name)}</b><p>${c.pep&&c.pep.freq?esc(flat(c.pep.freq)):'No protocol written yet.'}</p></div>`}).join('')}</div>
  <div class="pbox"><div class="bh"><h3>Red flags</h3><p>Stop and get checked if you notice these.</p></div>${PLAN.map(id=>{const c=CI[id];return `<div class="pl"><b>${esc(c.name)}</b>${c.pep&&c.pep.flags?fmt(c.pep.flags,{selfC:c.id}):'<p>No protocol written yet.</p>'}</div>`}).join('')}</div>
  </div></div>`;
}
function setPlan(list){PLAN=[...new Set(list)].filter(id=>CI[id]);savePlan();tabs();
  if(view==='plan'){history.replaceState(null,'',PLAN.length?'#/plan/'+PLAN.join(','):'#/plan');base=location.hash;planOut();planSug()}
  document.querySelectorAll('[data-plan]').forEach(b=>{const on=PLAN.includes(b.dataset.plan);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.innerHTML=planLbl(on)});
}
function render(){
  tabs();
  const plan=view==='plan';
  $('#ctl').hidden=plan;$('#keyw').hidden=plan;
  $('#q').value=plan?'':Q[view];$('#q').placeholder=view==='comp'?(isWide()?'Find a peptide by name or alias':'Peptide or alias'):view==='test'?'Search a blood test':'Search scans and checks';
  if(view==='comp'){$('#list').className='pep';$('#list').innerHTML=compList()}
  else if(view==='test'){$('#list').className='gls';$('#list').innerHTML=testList(false)}
  else if(view==='beyond'){$('#list').className='gls';$('#list').innerHTML=testList(true)}
  else{$('#list').className='';$('#list').innerHTML=planView();planOut();planSug()}
  applyCols();if(!$('#hist').hidden)showHist(document.activeElement===$('#q'));
}
function focusComp(id){const el=document.getElementById('c-'+id);if(!el)return;
  const xd=el.querySelector('.xp');if(xd)xd.open=true;el.scrollIntoView({block:'start',behavior:RM.matches?'auto':'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
function openSheet(kind,k,back){
  const p=$('#shp');
  p.innerHTML=kind==='t'?testSheet(TI[k],back):kind==='g'?groupSheet(k,back):markerSheet(+k,back);
  $('#sheet').hidden=false;document.body.style.overflow='hidden';p.scrollTop=0;
  const c=p.querySelector('[data-close]');if(c)c.focus({preventScroll:true});
}
function closeSheet(){$('#sheet').hidden=true;document.body.style.overflow=''}
function parse(h){h=decodeURIComponent((h||'').replace(/^#/,''));let m;
  if(!h||h==='/')return{v:'comp'};
  if(h==='/tests')return{v:'test'};if(h==='/beyond')return{v:'beyond'};
  if((m=h.match(/^\/plan\/add\/(.+)$/)))return{v:'plan',add:m[1]};
  if((m=h.match(/^\/plan(?:\/(.*))?$/)))return{v:'plan',list:m[1]};
  if((m=h.match(/^\/c\/(.+)$/)))return{v:'comp',focus:m[1]};
  if((m=h.match(/^\/([tgm])\/(.+)$/)))return{sheet:m[1],key:m[2]};
  if(CI[h])return{v:'comp',focus:h}; /* Library v19 links as /blood/#slug */
  return{v:'comp'}}
let first=true;
function route(){
  const r=parse(location.hash);
  if(r.sheet){
    const ok=r.sheet==='t'?TI[r.key]:r.sheet==='g'?GROUP[r.key]:(MK[+r.key]&&MK[+r.key].t.length);
    if(!ok){location.replace('#/');return}
    if(first){view=r.sheet==='t'&&TI[r.key].beyond?'beyond':r.sheet==='t'?'test':'comp';base=VIEWS.find(v=>v[0]===view)[2];render();first=false}
    openSheet(r.sheet,r.key,inSheet);inSheet=true;return;
  }
  const wasSheet=inSheet;inSheet=false;closeSheet();
  if(r.v==='plan'&&r.list)setPlanSilently(r.list.split(','));
  if(r.v==='plan'&&r.add){setPlanSilently(PLAN.concat(r.add));history.replaceState(null,'','#/plan/'+PLAN.join(','))}
  if(wasSheet&&!first&&r.v===view&&!r.focus){base=location.hash||'#/';return}
  const changed=r.v!==view;view=r.v;base=location.hash||'#/';render();
  if(r.focus){if(Q.comp&&!document.getElementById('c-'+r.focus)){Q.comp='';render()}focusComp(r.focus)}
  else if(changed&&!first){const tb=$('#tabs');if(tb.getBoundingClientRect().top<0)tb.scrollIntoView({block:'start'})}
  first=false;
}
function setPlanSilently(list){PLAN=[...new Set(list)].filter(id=>CI[id]);savePlan()}
document.addEventListener('click',e=>{
  const t=e.target;let b;
  if((b=t.closest('[data-close]'))){e.preventDefault();location.hash=base;return}
  if(t.closest('[data-back]')){history.back();return}
  if((b=t.closest('[data-go]'))){location.hash=b.dataset.go;return}
  if((b=t.closest('[data-plan]'))){const id=b.dataset.plan,had=PLAN.includes(id);setPlan(had?PLAN.filter(x=>x!==id):PLAN.concat(id));toast(CI[id].name+(had?' removed':' added')+` · ${PLAN.length} in plan`,PLAN.length?'#/plan/'+PLAN.join(','):'');b.blur();return}
  if((b=t.closest('[data-padd]'))){const q=$('#pq'),typed=q&&q.value.trim(),nx=b.nextElementSibling||b.previousElementSibling,ak=nx&&nx.dataset.padd,y0=nx?nx.getBoundingClientRect().top:0;if(!typed)showAll=true;setPlan(PLAN.concat(b.dataset.padd));if(q){q.value='';planSug()}const na=ak&&!typed&&document.querySelector('#psug [data-padd="'+ak+'"]');if(na){const d=na.getBoundingClientRect().top-y0;if(d)window.scrollBy(0,d)}if(typed&&q)q.focus({preventScroll:true});return}
  if((b=t.closest('[data-prm]'))){const an=$('#psug'),y0=an?an.getBoundingClientRect().top:0;setPlan(PLAN.filter(x=>x!==b.dataset.prm));if(an){const d=an.getBoundingClientRect().top-y0;if(d)window.scrollBy(0,d)}return}
  if(t.closest('[data-sall]')){showAll=!showAll;planSug();return}
  if((b=t.closest('#vsw [data-cols]'))){const m=isWide()?'w':'n',n=+b.dataset.cols;COLS[m]=n;try{localStorage.setItem('bw-cols-'+m,n)}catch(er){}applyCols();return}
  if((b=t.closest('[data-hq]'))){const q=b.dataset.hq,i=$('#q');Q[view]=q;i.value=q;addHist(q);$('#list').innerHTML=view==='comp'?compList():testList(view==='beyond');applyCols();i.blur();showHist(false);return}
  if(t.closest('[data-hclr]')){HIST[view]=[];saveH();drawHist();$('#q').focus({preventScroll:true});return}
  if(t.closest('[data-hsw]')){HON=!HON;try{HON?localStorage.removeItem('bw-hist-off'):localStorage.setItem('bw-hist-off','1')}catch(er){}if(!HON)HIST={comp:[],test:[],beyond:[]};saveH();drawHist();const s2=$('#hist [data-hsw]');if(s2)s2.focus({preventScroll:true});return}
  if((b=t.closest('[data-pclr]'))){const a=b.dataset.pclr;
    if(a==='ask'){PCONF=true;planOut();const y=$('#pclr [data-pclr="yes"]');if(y)y.focus({preventScroll:true});return}
    PCONF=false;if(a==='yes'){showAll=false;DONE=new Set();try{localStorage.removeItem('bw-prep')}catch(er){}setPlan([]);toast('Plan cleared · start again','');const q=$('#pq');if(q){q.value='';q.focus({preventScroll:true})}}else planOut();return}
  if(t.closest('[data-print]')){buildPdoc();window.print();return}
  if((b=t.closest('[data-copy]'))){const url=location.origin+location.pathname+'#/plan/'+PLAN.join(',');
    const done=()=>{b.textContent='Link copied';setTimeout(()=>b.textContent='Copy link to this plan',1800)};
    const show=()=>{const i=$('#plink');i.hidden=false;i.value=url;i.select()};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,show);else show();return}
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.chk;if(k===undefined)return;e.target.checked?DONE.add(k):DONE.delete(k);e.target.closest('li').classList.toggle('done',e.target.checked);try{localStorage.setItem('bw-prep',JSON.stringify([...DONE]))}catch(err){}});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){Q[view]=e.target.value;$('#list').innerHTML=view==='comp'?compList():testList(view==='beyond')}
  if(e.target.id==='pq')planSug();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden){location.hash=base;return}
  if(e.key==='Enter'&&e.target.id==='q'){e.target.blur();return}
  if(e.key==='Enter'&&e.target.id==='pq'){const f=$('#psug [data-padd]');if(f){e.preventDefault();f.click()}}
});
window.addEventListener('hashchange',route);
window.addEventListener('hashchange',()=>{const t=document.getElementById('toast');if(t&&!/^#\/plan/.test(location.hash))t.classList.remove('on')});
/* v18: text size set from the site bar (nav v9, bs-text). Zoom on main and the sheet; --z lets sticky offsets undo the zoom, --hk keeps headings calmer */
const TSK={s:.88,m:1,l:1.15};
function setTS(z){z=+z||1;curK=z;setTimeout(()=>{try{applyCols()}catch(e){}},0);['#main','#shp'].forEach(s=>{const el=$(s);if(el){el.style.zoom=z===1?'':z;el.style.setProperty('--z',z);el.style.setProperty('--hk',((1+.4*(z-1))/z).toFixed(4))}})}
/* v19: nav v10 sends {key,k,wide}; apply k. Fallback read: laptop bs-text-w (default l), phone bs-text (default m) */
function TSK0(){if(window.BS_TEXT)return BS_TEXT.get().k;const w=matchMedia('(min-width:1000px)').matches,K={s:.88,m:1,l:1.15,xl:1.3,xxl:1.45};let v;try{v=localStorage.getItem(w?'bs-text-w':'bs-text')}catch(e){}return K[v]||1.15}
setTS(TSK0());addEventListener('bs-text',e=>setTS(e.detail&&e.detail.k));
key();route();
})();
</script>
