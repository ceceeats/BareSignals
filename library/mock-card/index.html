<!doctype html>
<!-- Library card mock 1 (28 Oct 2026, preview only, not linked): one card per peptide instead of sticker > card > full page > deep read > Dosage page. Tap a sticker: the summary opens in place under its row. Read deeper: everything (how it works, every dose with sources, blood work, supplements, synergies, cautions, timeline, trials, sources) opens inside the same card. Five compounds, live Library v79 data. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Card mock · Bare Signals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{--paper:#FFFFE2;--chip:#FFFFF4;--ink:#3E4A80;--soft:#6B76A8;--rule:#E3E0BF;--act:#DB6830;--link:#5271FF;--red:#C02626;--dose:#2F6B46;
--head:"Bricolage Grotesque",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--body)}
button{font:inherit;color:inherit}
.wrap{max-width:var(--bs-w,1240px);margin:0 auto;padding:10px var(--bs-pad,16px) 60px}
h1{font:700 22px/1.1 var(--head);margin:6px 0 4px}
.note{font:500 10px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--act);margin:0 0 12px}
.lab{font:500 9px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:760px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.st{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;border:1.5px solid var(--ink);background:var(--chip);box-shadow:3px 3px 0 var(--rule);min-height:150px}
.st[aria-expanded=true]{outline:2px solid var(--ink);outline-offset:1px}
.st .in{padding:9px 9px 8px;flex:1;display:flex;flex-direction:column;gap:4px}
.st b{font:700 16px/1.1 var(--head)}
.st .u{font-size:12.5px;color:var(--soft);line-height:1.3}
.st .d{margin-top:auto;font:600 13px/1.2 var(--body);color:var(--act)}
.st .f{font:500 10.5px/1.2 var(--mono);color:var(--soft)}
.stripe{display:flex;height:9px}.stripe i{display:block}
.card{grid-column:1/-1;border:1.5px solid var(--ink);background:var(--chip);box-shadow:3px 3px 0 var(--rule);margin:2px 0 6px}
.ch{padding:11px 12px 6px;display:flex;gap:8px;align-items:flex-start}
.ch h2{font:700 21px/1.1 var(--head);margin:0;flex:1}
.x{all:unset;cursor:pointer;font:600 18px/1 var(--mono);padding:2px 4px}
.bd{font:500 8.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border:1px solid currentColor;margin-left:6px;vertical-align:3px}
.bd.fda{background:#E00000;color:#fff;border-color:#E00000}.bd.ht{color:#7A5FC9}.bd.bl{color:var(--act)}
.sec{padding:9px 12px;border-top:1px solid var(--rule)}
.punch{font:600 14.5px/1.35 var(--body);margin:0 12px 8px}
.sum{margin:0;font-size:13.5px}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,88px),auto));border:1.5px solid var(--ink);margin:8px 0 0}
.cells div{padding:6px 8px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.cells .v{font:600 13.5px/1.25 var(--body)}.cells .dz .v{color:var(--act)}
.tag{display:inline-block;font:500 8.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 5px;white-space:nowrap}
.roles{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.roles li{display:flex;gap:7px;align-items:baseline;font-size:13px}
.pools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:6px 0 4px}
.pools div{border:1px solid var(--rule);background:var(--paper);padding:6px 7px}
.pools b{display:block;font:700 18px/1 var(--mono);color:var(--ink)}
.pools span{font-size:11px;color:var(--soft);line-height:1.25;display:block;margin-top:3px}
.acts{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px 11px;border-top:1px solid var(--rule)}
.more{all:unset;cursor:pointer;font:600 13px/1 var(--body);color:#fff;background:var(--ink);padding:10px 14px}
.lnk{color:var(--link);text-decoration:underline;text-underline-offset:2px}
.addp{all:unset;cursor:pointer;font:700 13px/1 var(--body);color:var(--act)}
.deep h3{font:600 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px}
.deep .sec{border-left:4px solid var(--b,var(--rule));background:var(--t,transparent);margin:8px 12px;border-top:0;padding:8px 10px}
.deep ol,.deep ul{margin:0;padding-left:18px}.deep li{margin:0 0 5px;font-size:13px}
.deep li small{display:block;color:var(--soft);font-size:11.5px}
.tiers{width:100%;border-collapse:collapse;font-size:12.5px}.tiers td{padding:5px 4px;border-top:1px solid var(--rule);vertical-align:top}
.tiers td:first-child{font:500 9.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
.tiers .dv{color:var(--act);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:4px 6px 4px 5px;border:1px solid var(--rule);background:var(--paper);display:inline-flex;gap:5px;align-items:center}
.chip i{width:9px;height:9px;border:1px solid rgba(62,74,128,.4)}
.syn p{margin:0 0 6px;font-size:13px}.syn b{font-weight:700}
.tl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px}.tl b{font:600 10.5px/1.4 var(--mono);color:var(--soft)}
.src a{font-size:12px;display:block;margin:0 0 3px}
.dn{font-size:12px;color:var(--soft);margin:6px 0 0}
.closeb{all:unset;cursor:pointer;display:block;text-align:center;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:12px;border-top:1px solid var(--rule)}
.len{font:500 9.5px/1 var(--mono);letter-spacing:.06em;color:var(--soft);text-transform:uppercase;margin-left:auto}
</style><script src="/nav.js" defer></script>
<script src="/library/v79/data.js"></script><script src="/library/v79/page.js"></script><script src="/library/v79/punch.js"></script><script src="/library/v79/take.js"></script><script src="/library/v79/faq.js"></script><script src="/blood/v21/lib.js"></script>
</head><body><div class="wrap">
<h1>One card per peptide</h1>
<p class="note">Mock-up · 5 compounds · tap a sticker: the summary opens under it · Read deeper opens everything in the same card</p>
<div class="grid" id="g"></div></div>
<script>
const SL=['bpc-157','retatrutide','ghk-cu','klow','selank'];
const D=window.BS_DATA,PG=window.BS_PAGE||{},PU=window.BS_PUNCH||{},TK=window.BS_TAKE||{},FQ=window.BS_FAQ||{},BW=window.BW_LIB||{tests:{},comps:{},sup:{}};
const PAL={};(window.BS_PALETTE||[]).forEach(p=>PAL[p[0]]=[p[1],p[2]]);
const by=s=>D.find(o=>o.slug===s),esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fg=h=>{const n=parseInt(h.slice(1),16),L=(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255;return L>.6?'#3E4A80':'#FFFFF0'};
const col=r=>(PAL[r]||[r,'#ccc'])[1],nm=r=>(PAL[r]||[r])[0];
const tag=r=>`<span class="tag" style="background:${col(r)};color:${fg(col(r))}">${esc(nm(r))}</span>`;
const stripe=o=>{const rs=o.roles.filter(r=>PAL[r]);return `<div class="stripe">${rs.map((r,i)=>`<i style="flex:${rs.length===1?1:i===0?70:30/(rs.length-1)};background:${col(r)}"></i>`).join('')}</div>`};
const first=(t,n)=>String(t||'').split(/(?<=\.)\s+/).slice(0,n).join(' ');
let open=null,deep=false;
function sticker(o){return `<button class="st" data-s="${o.slug}" aria-expanded="${open===o.slug}"><span class="in"><b>${esc(o.name)}</b><span class="u">${esc(o.dose&&o.dose.use||'')}</span><span class="d">${esc(o.dose&&o.dose.dose||'')}</span><span class="f">${esc([o.dose&&o.dose.freq,o.dose&&o.dose.cycle].filter(Boolean).join(' · '))}</span></span>${stripe(o)}</button>`}
function badges(o){return (o.fda?'<span class="bd fda">FDA ✓</span>':'')+(o.trial?'<span class="bd ht">H.trial</span>':'')+(o.blend?'<span class="bd bl">Blend</span>':'')}
function summary(o){const p=PG[o.slug]||{},d=o.dose||{},t=TK[o.slug];
 const cells=[['Dose',d.dose,'dz'],['How often',d.freq],['Cycle',d.cycle],['Route',d.route]].filter(c=>c[1]);
 return `<div class="ch"><h2>${esc(o.name)}${badges(o)}</h2><button class="x" data-close aria-label="Close">×</button></div>
 ${PU[o.slug]?`<p class="punch">${esc(PU[o.slug])}</p>`:''}${stripe(o)}
 <div class="sec"><p class="sum">${esc(t&&t.what?t.what:first(p.sum,2))}</p>
 <div class="cells">${cells.map(c=>`<div class="${c[2]||''}"><div class="lab">${c[0]}</div><div class="v">${esc(c[1])}</div></div>`).join('')}</div>
 ${o.blend?`<p class="dn"><b>Inside:</b> ${o.blend.parts.map(x=>esc(x[2])+' '+x[1]).join(' + ')} ${esc(o.blend.unit||'')}</p>`:''}</div>
 <div class="sec"><div class="lab">What it does</div><ul class="roles">${o.roles.filter(r=>PAL[r]).map(r=>`<li>${tag(r)}<span>${esc((o.desc||{})[r]||'')}</span></li>`).join('')}</ul></div>
 ${p.pools&&p.pools.length?`<div class="sec"><div class="lab">What people report</div><div class="pools">${p.pools.slice(0,3).map(x=>`<div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>${p.rp&&p.rp.length?`<p class="dn">${esc(p.rp.slice(0,3).join(' · '))}</p>`:''}</div>`:''}
 ${o.whoNot&&o.whoNot.length?`<div class="sec"><div class="lab" style="color:var(--red)">Who shouldn’t take it</div><p class="dn" style="color:var(--ink)">${esc(o.whoNot.slice(0,2).map(w=>w.t).join(' · '))}</p></div>`:''}
 <div class="acts"><button class="more" data-deep>${deep?'Read less ↑':'Read deeper ↓'}</button><span><a class="lnk" href="/plan/mock5/">Calculator</a> · <button class="addp">+ Add to protocol</button></span></div>`}
function deepHTML(o){const p=PG[o.slug]||{},d=o.dose||{},pd=p.dose||{};
 const bw=(BW.comps[o.slug]||{}),bt=(bw.before||[]).map(x=>BW.tests[x[0]]).filter(Boolean),sp=BW.sup[o.slug]||[];
 const sec=(t,b,c)=>`<div class="sec" style="--b:${c[0]};--t:${c[1]}"><h3 style="color:${c[2]||'var(--ink)'}">${t}</h3>${b}</div>`;
 let h='';
 h+=sec('How it works',`<ol>${(o.mech||[]).map((m,i)=>`<li><b>${esc(m[0])}</b><small>${esc(m[1])}</small>${p.mx&&p.mx[i]?`<small style="color:var(--ink)">${esc(p.mx[i])}</small>`:''}</li>`).join('')}</ol>${p.deep?`<p class="dn" style="color:var(--ink)">${esc(p.deep)}</p>`:''}`,['#6777B6','rgba(103,119,182,.06)']);
 h+=sec('Every dose people use',`${pd.tiers?`<table class="tiers">${pd.tiers.map(t=>`<tr><td>${esc(t.label)}</td><td><span class="dv">${esc(t.dose)}</span><br>${esc([t.freq,t.dur,t.route].filter(Boolean).join(' · '))}<br><small style="color:var(--soft)">${esc(t.who||'')}</small></td></tr>`).join('')}</table>`:''}${d.tiernote?`<p class="dn"><b style="color:var(--act)">Dose watch</b> ${esc(d.tiernote)}</p>`:''}<p class="dn"><b>How doses are found:</b> community doses come from user logs and dosing guides, label doses from approved labels and trials; each line lists its sources.</p>${d.half?`<p class="dn">Half-life ${esc(d.half)}</p>`:''}`,['#5271FF','rgba(82,113,255,.05)']);
 if(p.wk||p.dn)h+=sec('What worked, what didn’t',`<ul>${(p.wk||[]).map(x=>`<li>✓ ${esc(x)}</li>`).join('')}${(p.dn||[]).map(x=>`<li>✕ ${esc(x)}</li>`).join('')}</ul>${p.reports?`<p class="dn">${esc(p.reports)}</p>`:''}`,['#E8C200','rgba(255,222,89,.10)']);
 if(o.blend)h+=sec('What’s inside',`<ul>${o.blend.parts.map(x=>`<li><b>${esc(x[2])} ${x[1]} ${esc(o.blend.unit)}</b><small>${esc(x[3])}</small></li>`).join('')}</ul>`,['#DB6830','rgba(219,104,48,.05)']);
 if(o.syn&&o.syn.length)h+=sec('Synergies',`<div class="syn">${o.syn.slice(0,6).map(s=>`<p><b>${esc(s)}</b>${p.sx&&p.sx[s]?' · '+esc(p.sx[s]):''}</p>`).join('')}${o.syn.length>6?`<div class="chips">${o.syn.slice(6).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`:''}</div>`,['#B493E8','rgba(180,147,232,.07)']);
 if(bt.length)h+=sec('Blood work',`<p class="dn" style="margin:0 0 6px">Test before you start, then ${esc(bw.freq||'every 3-6 months')}.</p><div class="chips">${bt.map(t=>`<span class="chip"><i style="background:${t[1]}"></i>${esc(t[0])}</span>`).join('')}</div>`,['#E46C9A','rgba(252,176,180,.12)']);
 if(sp.length)h+=sec('Supplements people pair with it',`<div class="chips">${sp.map(s=>`<a class="chip" href="/supplements/" style="color:inherit;text-decoration:none"><i style="background:${s[2]}"></i>${esc(s[1])}</a>`).join('')}</div>`,['#5E8A33','rgba(170,204,150,.10)']);
 if(o.whoNot&&o.whoNot.length)h+=sec('Who shouldn’t take it',`<ul>${o.whoNot.map(w=>`<li><b>${esc(w.t)}</b><small>${esc(w.why)}</small></li>`).join('')}</ul>`,['#C02626','rgba(255,80,80,.06)','#C02626']);
 if(o.tl&&o.tl.length)h+=sec('Where it comes from',`<div class="tl">${o.tl.map(t=>`<b>${esc(t[0])}</b><span>${esc(t[1])}</span>`).join('')}</div>${o.status?`<p class="dn">${esc(o.status)}</p>`:''}${o.trial?`<p class="dn">Trial: ${esc(o.trial.phase)} · ${esc(o.trial.what)} (${esc(o.trial.id)})</p>`:''}`,['#3E4A80','transparent']);
 const fq=FQ[o.slug];if(fq&&fq.length)h+=sec('Questions people ask',fq.map(q=>`<p class="dn" style="color:var(--ink)"><b>${esc(q.q||q[0])}</b><br>${esc(q.a||q[1])}</p>`).join(''),['#3E4A80','transparent']);
 const src=(p.sources||[]).concat(pd.tiers?pd.tiers.flatMap(t=>t.src||[]):[]);const seen=new Set(),S=src.filter(s=>s&&s[1]&&!seen.has(s[1])&&seen.add(s[1]));
 if(S.length)h+=sec('Sources',`<div class="src">${S.map((s,i)=>`<a class="lnk" href="${esc(s[1])}" target="_blank" rel="noopener">${i+1}. ${esc(s[0])}</a>`).join('')}</div>`,['#E3E0BF','transparent']);
 return `<div class="deep">${h}</div><button class="closeb" data-close>Close ${esc(o.name)} ↑</button>`}
function render(){const g=document.getElementById('g');const cols=innerWidth>=760?5:2;let h='';
 SL.forEach((s,i)=>{h+=sticker(by(s));const endRow=(i%cols===cols-1)||i===SL.length-1;if(open&&endRow){const oi=SL.indexOf(open);if(Math.floor(oi/cols)===Math.floor(i/cols)){const o=by(open);h+=`<section class="card" id="card">${summary(o)}${deep?deepHTML(o):''}</section>`}}});
 g.innerHTML=h}
document.addEventListener('click',e=>{const st=e.target.closest('.st');if(st){const s=st.dataset.s;if(open===s){open=null}else{open=s;deep=false}render();if(open){const c=document.getElementById('card');c&&c.scrollIntoView({behavior:'smooth',block:'nearest'})}return}
 if(e.target.closest('[data-close]')){const s=open;open=null;deep=false;render();const t=document.querySelector(`.st[data-s="${s}"]`);t&&t.scrollIntoView({behavior:'smooth',block:'center'});return}
 if(e.target.closest('[data-deep]')){deep=!deep;render();return}
 if(e.target.closest('.addp')){e.target.closest('.addp').textContent='✓ Added';return}});
addEventListener('resize',()=>render());render();
</script></body></html>
